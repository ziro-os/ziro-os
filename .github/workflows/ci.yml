name: Ziro-OS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit-tests:
    name: Unit & Audit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: |
            tools/ziroctl/go.sum
            tools/ziropkg/go.sum

      - name: Install OpenSSH for effective-policy tests
        run: |
          sudo apt-get update
          sudo apt-get install -y openssh-server swtpm
          sudo mkdir -p /run/sshd

      - name: Run Unit Tests (ziroctl & ziropkg)
        run: make test-unit

      - name: TPM 2.0 seal/unseal against swtpm (software TPM)
        run: |
          swtpm socket --tpm2 --server type=tcp,port=2321 --ctrl type=tcp,port=2322 \
            --tpmstate dir="$(mktemp -d)" --flags not-need-init,startup-clear &
          sleep 1
          cd tools/ziroctl && ZIRO_TPM_SIM=127.0.0.1:2321 go test -run TestTPMSeal -v ./cmd

      - name: Vulnerability scan (govulncheck, reachable code)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          (cd tools/ziroctl && govulncheck ./...)
          (cd tools/ziropkg && govulncheck ./...)
          (cd packages/cni-dhcp && GOOS=linux govulncheck github.com/containernetworking/plugins/plugins/ipam/dhcp)

      - name: Test installer bootstrap transport
        run: python3 tests/security/test-userdata-transport.py

      - name: Test patched DHCP packet parser
        run: |
          cd packages/cni-dhcp
          go test -mod=readonly -run TestReadFrom github.com/insomniacslk/dhcp/dhcpv4/nclient4

      - name: Validate Security Audit CLI
        run: |
          cd tools/ziroctl
          go run . security audit --json

  build-and-smoke:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    env:
      KERNEL_FLAVOR: alpine # the custom (default) flavor is built and boot-tested by kernel-custom.yml
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: |
            tools/ziroctl/go.sum
            tools/ziropkg/go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential xorriso mtools dosfstools qemu-utils qemu-system-x86 cpio gzip

      - name: Enable KVM for QEMU boot test
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Build Static CLI Tools
        run: make tools

      - name: Build Rootfs (x86_64)
        run: make rootfs-x86_64

      - name: Build Docker Base Image
        run: make docker-image IMAGE_TAG=ziro-os:ci

      - name: Run Container Smoke Test Suite (Includes ziropkg install curl)
        run: make test-smoke IMAGE_TAG=ziro-os:ci

      - name: Build Hybrid Bootable ISO
        run: make image-iso TARGET_ARCH=x86_64

      - name: QEMU Boot Smoke Test (kernel/modules, containerd, firewall, Sentinel, DHCP, container run)
        run: make test-boot TARGET_ARCH=x86_64 BOOT_ARGS=--installed

      - name: Upload QEMU serial log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: qemu-boot-log-${{ github.sha }}
          path: build/qemu-*.log
          if-no-files-found: ignore

      - name: Verify Artifacts & enforce image size goal (< 300 MB)
        run: |
          ls -la build/
          for f in build/ziro-os-x86_64.iso build/ziro-initramfs-x86_64.cpio.gz; do
            size=$(stat -c %s "$f")
            echo "$f: $((size / 1000000)) MB"
            [ "$size" -lt 300000000 ] || { echo "::error::$f exceeds the 300 MB image goal"; exit 1; }
          done
          test -f build/ziro-os-x86_64.iso
          test -f build/ziro-rootfs-x86_64.tar.gz
          test -f build/ziro-initramfs-x86_64.cpio.gz

      - name: Verify archive security metadata
        run: python3 tests/security/test-artifact-metadata.py build/ziro-rootfs-x86_64.tar.gz build/ziro-initramfs-x86_64.cpio.gz

      - name: Verify rebuilt DHCP CNI plugin
        run: python3 tests/security/test-cni-dhcp.py build/rootfs-full-x86_64 x86_64

      - name: Upload CI Artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ziro-os-ci-x86_64-${{ github.sha }}
          path: |
            build/ziro-os-x86_64.iso
            build/ziro-rootfs-x86_64.tar.gz
            build/ziro-initramfs-x86_64.cpio.gz
            bin/ziroctl
            bin/ziropkg
          if-no-files-found: error
