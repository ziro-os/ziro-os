name: Ziro-OS CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  unit-tests:
    name: Unit & Audit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: |
            tools/ziroctl/go.sum
            tools/ziropkg/go.sum

      - name: Run Unit Tests (ziroctl & ziropkg)
        run: make test-unit

      - name: Validate Security Audit CLI
        run: |
          cd tools/ziroctl
          go run . security audit --json

  build-and-smoke:
    name: Build & Smoke Test
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: |
            tools/ziroctl/go.sum
            tools/ziropkg/go.sum

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential xorriso mtools dosfstools qemu-utils cpio gzip

      - name: Build Static CLI Tools
        run: make tools

      - name: Build Rootfs (x86_64)
        run: make rootfs-x86_64

      - name: Build Docker Base Image
        run: make docker-image IMAGE_TAG=ziro-os:ci

      - name: Run Container Smoke Test Suite (Includes ziropkg install curl)
        run: make test-smoke IMAGE_TAG=ziro-os:ci

      - name: Build Hybrid Bootable ISO
        run: make image-iso TARGET_ARCH=x86_64

      - name: Verify Artifacts
        run: |
          ls -la build/
          test -f build/ziro-os-x86_64.iso
          test -f build/ziro-rootfs-x86_64.tar.gz
          test -f build/ziro-initramfs-x86_64.cpio.gz

      - name: Upload CI Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ziro-os-ci-x86_64-${{ github.sha }}
          path: |
            build/ziro-os-x86_64.iso
            build/ziro-rootfs-x86_64.tar.gz
            build/ziro-initramfs-x86_64.cpio.gz
            bin/ziroctl
            bin/ziropkg
          if-no-files-found: error