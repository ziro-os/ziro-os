name: Build and Release Ziro-OS

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - release
          - hotfix

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - name: Set build matrix
        id: set-matrix
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
            # Full matrix for releases
            echo 'matrix={"arch":["x86_64","arm64"],"image_type":["bootable","advanced","cloud","enhanced"]}' >> $GITHUB_OUTPUT
          else
            # Minimal matrix for development
            echo 'matrix={"arch":["x86_64"],"image_type":["bootable","advanced"]}' >> $GITHUB_OUTPUT
          fi

  build-kernel:
    runs-on: ubuntu-latest
    needs: build-matrix
    strategy:
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
      fail-fast: false
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Cache kernel build
        uses: actions/cache@v3
        with:
          path: |
            kernel/build-${{ matrix.arch }}
            kernel/bzImage-${{ matrix.arch }}
          key: kernel-${{ matrix.arch }}-${{ hashFiles('kernel/**') }}-${{ github.sha }}
          restore-keys: |
            kernel-${{ matrix.arch }}-${{ hashFiles('kernel/**') }}-
            kernel-${{ matrix.arch }}-

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses5-dev \
            libssl-dev \
            libelf-dev \
            bison \
            flex \
            bc \
            kmod \
            cpio \
            wget \
            xz-utils \
            qemu-system-x86 \
            qemu-system-arm \
            qemu-utils \
            genisoimage \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-common \
            parted \
            mtools \
            ovmf

      - name: Install cross-compilation tools
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Build kernel
        run: |
          chmod +x kernel/build-kernel-native.sh
          make kernel TARGET_ARCH=${{ matrix.arch }}

      - name: Upload kernel artifact
        uses: actions/upload-artifact@v3
        with:
          name: kernel-${{ matrix.arch }}
          path: |
            kernel/bzImage-${{ matrix.arch }}
            kernel/modules-${{ matrix.arch }}
          retention-days: 7

  build-rootfs:
    runs-on: ubuntu-latest
    needs: build-matrix
    strategy:
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Cache Go modules
        uses: actions/cache@v3
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: go-${{ matrix.arch }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            go-${{ matrix.arch }}-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            debootstrap \
            qemu-user-static \
            binfmt-support

      - name: Build rootfs
        run: |
          export TARGET_ARCH=${{ matrix.arch }}
          make rootfs

      - name: Build tools
        run: |
          export GOARCH=${{ matrix.arch == 'x86_64' && 'amd64' || 'arm64' }}
          export GOOS=linux
          make tools

      - name: Upload rootfs artifact
        uses: actions/upload-artifact@v3
        with:
          name: rootfs-${{ matrix.arch }}
          path: |
            rootfs/
            bin/
          retention-days: 7

  build-images:
    runs-on: ubuntu-latest
    needs: [build-kernel, build-rootfs, build-matrix]
    strategy:
      matrix: ${{ fromJson(needs.build-matrix.outputs.matrix) }}
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download kernel artifact
        uses: actions/download-artifact@v3
        with:
          name: kernel-${{ matrix.arch }}
          path: kernel/

      - name: Download rootfs artifact
        uses: actions/download-artifact@v3
        with:
          name: rootfs-${{ matrix.arch }}
          path: ./

      - name: Install image build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-system-arm \
            qemu-utils \
            genisoimage \
            grub-pc-bin \
            grub-efi-amd64-bin \
            grub-common \
            parted \
            mtools \
            ovmf \
            cryptsetup

      - name: Make scripts executable
        run: |
          chmod +x images/bootable/*.sh
          chmod +x kernel/*.sh

      - name: Build images
        run: |
          export TARGET_ARCH=${{ matrix.arch }}
          export VERSION=${{ github.ref_name }}-${{ github.sha }}
          
          case "${{ matrix.image_type }}" in
            "bootable")
              make image-bootable
              ;;
            "advanced")
              make image-advanced
              ;;
            "cloud")
              make image-cloud
              ;;
            "enhanced")
              make image-enhanced
              ;;
          esac

      - name: List built images
        run: |
          find images/bootable/output -type f -name "*.img" -o -name "*.iso" -o -name "*.qcow2" -o -name "*.vhd" -o -name "*.vmdk" | head -20

      - name: Upload image artifacts
        uses: actions/upload-artifact@v3
        with:
          name: images-${{ matrix.arch }}-${{ matrix.image_type }}
          path: |
            images/bootable/output/
          retention-days: 30

  test-images:
    runs-on: ubuntu-latest
    needs: [build-images, build-matrix]
    if: github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')
    strategy:
      matrix:
        arch: [x86_64]  # Only test x86_64 in CI for now
        image_type: [bootable, advanced]
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download image artifacts
        uses: actions/download-artifact@v3
        with:
          name: images-${{ matrix.arch }}-${{ matrix.image_type }}
          path: images/bootable/output/

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            qemu-system-x86 \
            qemu-utils \
            expect

      - name: Make test scripts executable
        run: |
          chmod +x images/bootable/*.sh

      - name: Run basic boot test
        timeout-minutes: 10
        run: |
          cd images/bootable
          # Create a simple automated test
          expect << 'EOF'
          set timeout 60
          spawn ./test-qemu.sh
          expect {
            "Ziro-OS" { 
              send_user "✅ Boot test passed\n"
              exit 0 
            }
            timeout { 
              send_user "❌ Boot test timed out\n"
              exit 1 
            }
          }
          EOF

  create-release:
    runs-on: ubuntu-latest
    needs: [build-images, build-matrix]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all image artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/

      - name: Organize release assets
        run: |
          mkdir -p release-assets
          
          # Copy and rename artifacts for release
          for arch in x86_64 arm64; do
            for image_type in bootable advanced cloud enhanced; do
              if [ -d "artifacts/images-${arch}-${image_type}" ]; then
                cp -r artifacts/images-${arch}-${image_type}/* release-assets/ || true
              fi
            done
          done
          
          # Create checksums
          cd release-assets
          sha256sum * > checksums.txt
          
          # List all files
          ls -la

      - name: Generate release notes
        id: release_notes
        run: |
          cat > release_notes.md << 'EOF'
          # Ziro-OS Release ${{ github.ref_name }}
          
          ## 🚀 Features
          
          - **Multi-Architecture Support**: x86_64 and ARM64 builds
          - **Enhanced Boot System**: UEFI and BIOS support
          - **Cloud-Ready Images**: AWS, Azure, GCP, VMware formats
          - **Container-Native**: Optimized for container workloads
          - **Security Hardening**: Encryption and secure boot support
          
          ## 📦 Available Images
          
          ### x86_64 (Intel/AMD)
          - `ziro-os-*-x86_64.img` - Raw disk image for VMs/cloud
          - `ziro-os-*-x86_64.qcow2` - QEMU compressed image
          - `ziro-os-*-x86_64.iso` - Installation ISO
          - `ziro-os-aws-*-x86_64.img` - AWS AMI format
          - `ziro-os-azure-*-x86_64.vhd` - Azure VHD format
          - `ziro-os-gcp-*-x86_64.img` - GCP image format
          - `ziro-os-vmware-*-x86_64.vmdk` - VMware format
          
          ### ARM64 (Apple Silicon, ARM servers)
          - `ziro-os-*-arm64.img` - Raw disk image for VMs/cloud
          - `ziro-os-*-arm64.qcow2` - QEMU compressed image
          - `ziro-os-*-arm64.iso` - Installation ISO
          - Cloud formats for ARM64 deployments
          
          ## 🔧 Installation
          
          ### QEMU/KVM
          ```bash
          qemu-system-x86_64 -m 2G -drive file=ziro-os-*.qcow2,format=qcow2
          ```
          
          ### Hardware Installation
          ```bash
          sudo dd if=ziro-os-*.iso of=/dev/sdX bs=4M status=progress
          ```
          
          ### Cloud Deployment
          Upload the appropriate cloud image format to your provider.
          
          ## 📊 System Requirements
          
          - **Memory**: 512MB minimum, 2GB recommended
          - **Storage**: 1GB minimum, 4GB recommended
          - **CPU**: Any x86_64 or ARM64 processor
          - **Virtualization**: KVM, VMware, VirtualBox, QEMU
          
          ## 🔍 Verification
          
          Verify downloads with checksums:
          ```bash
          sha256sum -c checksums.txt
          ```
          
          Built from commit: ${{ github.sha }}
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Ziro-OS ${{ github.ref_name }}
          body_path: release_notes.md
          files: |
            release-assets/*
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-container-images:
    runs-on: ubuntu-latest
    needs: [build-images, build-matrix]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/'))
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          platforms: linux/amd64,linux/arm64

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Download image artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts/

      - name: Create container image
        run: |
          mkdir -p container-build
          
          # Create Dockerfile for Ziro-OS container
          cat > container-build/Dockerfile << 'EOF'
          FROM scratch
          
          # Copy Ziro-OS images
          COPY artifacts/ /ziro-os/
          
          # Add metadata
          LABEL org.opencontainers.image.title="Ziro-OS"
          LABEL org.opencontainers.image.description="Container-native operating system"
          LABEL org.opencontainers.image.source="https://github.com/${{ github.repository }}"
          LABEL org.opencontainers.image.version="${{ github.ref_name }}"
          LABEL org.opencontainers.image.revision="${{ github.sha }}"
          
          # Default command
          CMD ["/bin/sh", "-c", "echo 'Ziro-OS images available in /ziro-os/'"]
          EOF
          
          # Copy artifacts
          cp -r artifacts container-build/

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: container-build
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  notify-completion:
    runs-on: ubuntu-latest
    needs: [build-images, test-images, create-release]
    if: always()
    
    steps:
      - name: Notify build completion
        run: |
          if [[ "${{ needs.build-images.result }}" == "success" ]]; then
            echo "✅ Build completed successfully"
            if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/tags/* ]]; then
              echo "🎉 Release ${{ github.ref_name }} created successfully"
            fi
          else
            echo "❌ Build failed"
            exit 1
          fi