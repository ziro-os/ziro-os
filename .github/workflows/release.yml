name: Ziro-OS Release & Image Publishing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  release:
    name: Build & Publish Release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine Version Tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Building release for: ${TAG}"

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.22'
          cache-dependency-path: |
            tools/ziroctl/go.sum
            tools/ziropkg/go.sum

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential xorriso mtools dosfstools qemu-utils cpio gzip

      - name: Build Multi-Architecture Tools
        run: make tools-all

      - name: Build Multi-Architecture Rootfs & Initramfs
        run: make rootfs-all

      - name: Build Bootable Hybrid ISO
        run: make image-iso TARGET_ARCH=x86_64

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Multi-Architecture Docker Base Image
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "Publishing container image to ghcr.io/${REPO}:${TAG}..."
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "ghcr.io/${REPO}:${TAG}" \
            -t "ghcr.io/${REPO}:latest" \
            -f images/docker/Dockerfile \
            --push \
            .

      - name: Generate Checksums
        run: |
          mkdir -p build
          cd build
          sha256sum ziro-os-*.iso ziro-rootfs-*.tar.gz ziro-initramfs-*.cpio.gz > SHA256SUMS
          cd ../bin
          sha256sum ziroctl-* ziropkg-* >> ../build/SHA256SUMS
          echo "Generated SHA256SUMS:"
          cat ../build/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Ziro-OS ${{ steps.version.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          overwrite: true
          overwrite_files: true
          files: |
            build/ziro-os-*.iso
            build/ziro-rootfs-*.tar.gz
            build/ziro-initramfs-*.cpio.gz
            build/SHA256SUMS
            bin/ziroctl-*
            bin/ziropkg-*

  deploy-pages:
    name: Deploy Release Portal to GitHub Pages
    needs: release
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Generate Release Download Portal
        run: |
          chmod +x scripts/generate-release-page.sh
          ./scripts/generate-release-page.sh _site
        env:
          GITHUB_REF_NAME: ${{ needs.release.outputs.tag }}

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: '_site'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5