name: Ziro-OS Release & Image Publishing

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version tag (e.g. v1.0.1)'
        required: true
        default: 'v1.0.1'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write
  packages: write
  pages: write
  id-token: write

jobs:
  custom-kernel:
    name: Custom kernel flavor
    uses: ./.github/workflows/kernel-custom.yml

  # Runs in parallel with the custom-kernel jobs; only 'publish' waits for both.
  build:
    name: Build alpine flavor & tools
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine Version Tag
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="${{ github.event.inputs.version }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          [[ "$TAG" =~ ^v ]] || TAG="v${TAG}"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "Building release for: ${TAG}"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: |
            tools/ziroctl/go.sum
            tools/ziropkg/go.sum

      - name: Set up QEMU (arm64 rootfs build containers)
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential xorriso mtools dosfstools qemu-utils cpio gzip

      - name: Build Multi-Architecture Tools
        run: make tools-all

      - name: Build Multi-Architecture Rootfs & Initramfs
        run: make rootfs-all

      - name: Build Bootable Hybrid ISO
        run: ./images/iso/build-iso.sh x86_64

      - name: Enforce image size goal (< 300 MB)
        run: |
          for f in build/ziro-os-x86_64.iso build/ziro-initramfs-x86_64.cpio.gz build/ziro-initramfs-arm64.cpio.gz; do
            size=$(stat -c %s "$f")
            echo "$f: $((size / 1000000)) MB"
            [ "$size" -lt 300000000 ] || { echo "::error::$f exceeds the 300 MB image goal"; exit 1; }
          done

      - name: Upload release build outputs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-build
          path: |
            build/ziro-os-*.iso
            build/ziro-rootfs-*.tar.gz
            build/ziro-initramfs-*.cpio.gz
            build/vmlinuz-*
            bin/ziroctl-*
            bin/ziropkg-*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish Release
    needs: [build, custom-kernel]
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ needs.build.outputs.tag }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download release build outputs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: release-build
          path: .

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Download custom kernel flavor artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: custom-kernel-*
          path: build
          merge-multiple: true

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push Multi-Architecture Docker Base Image
        run: |
          TAG="${{ needs.build.outputs.tag }}"
          REPO=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "Publishing container image to ghcr.io/${REPO}:${TAG}..."
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            -t "ghcr.io/${REPO}:${TAG}" \
            -t "ghcr.io/${REPO}:latest" \
            -f images/docker/Dockerfile \
            --push \
            .

      - name: Generate Checksums
        run: |
          mkdir -p build
          cd build
          sha256sum ziro-os-*.iso ziro-rootfs-*.tar.gz ziro-initramfs-*.cpio.gz vmlinuz-x86_64* vmlinuz-arm64* kernel-config-* > SHA256SUMS
          cd ../bin
          sha256sum ziroctl-* ziropkg-* >> ../build/SHA256SUMS
          echo "Generated SHA256SUMS:"
          cat ../build/SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: "Ziro-OS ${{ needs.build.outputs.tag }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          make_latest: true
          overwrite_files: true
          files: |
            build/ziro-os-*.iso
            build/ziro-rootfs-*.tar.gz
            build/ziro-initramfs-*.cpio.gz
            build/vmlinuz-x86_64*
            build/vmlinuz-arm64*
            build/kernel-config-*
            build/SHA256SUMS
            bin/ziroctl-*
            bin/ziropkg-*

  deploy-pages:
    name: Trigger Release Portal Deployment on Main
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Trigger GitHub Pages Workflow on Main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Dispatching pages.yml on main branch to deploy release portal..."
          # No checkout in this job, so the repo must be explicit. Releases created with GITHUB_TOKEN
          # do not fire 'on: release' in other workflows, so this dispatch is the only path that
          # regenerates the portal with the published asset sizes: let it fail loudly.
          gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"