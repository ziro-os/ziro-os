name: Documentation

on:
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'community/**'
      - 'README.md'
      - '*.md'
  pull_request:
    branches: [ main ]
    paths:
      - 'docs/**'
      - 'community/**'
      - 'README.md'
      - '*.md'

jobs:
  lint-docs:
    name: Lint Documentation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install markdownlint
      run: npm install -g markdownlint-cli
      
    - name: Lint Markdown files
      run: |
        markdownlint docs/ community/ *.md \
          --ignore node_modules \
          --ignore .github \
          --config .markdownlint.json || true
          
    - name: Check links
      uses: gaurav-nelson/github-action-markdown-link-check@v1
      with:
        use-quiet-mode: 'yes'
        use-verbose-mode: 'yes'
        config-file: '.markdown-link-check.json'

  build-docs:
    name: Build Documentation Site
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install MkDocs
      run: |
        pip install mkdocs mkdocs-material mkdocs-mermaid2-plugin
        
    - name: Create MkDocs config
      run: |
        cat > mkdocs.yml << 'EOF'
        site_name: Ziro-OS Documentation
        site_description: Container-native operating system documentation
        site_url: https://docs.ziro-os.io
        repo_url: https://github.com/ziro-os/ziro-os
        repo_name: ziro-os/ziro-os
        
        theme:
          name: material
          palette:
            - scheme: default
              primary: blue
              accent: blue
              toggle:
                icon: material/brightness-7
                name: Switch to dark mode
            - scheme: slate
              primary: blue
              accent: blue
              toggle:
                icon: material/brightness-4
                name: Switch to light mode
          features:
            - navigation.tabs
            - navigation.sections
            - navigation.expand
            - navigation.top
            - search.highlight
            - search.share
            - content.code.copy
        
        plugins:
          - search
          - mermaid2
        
        nav:
          - Home: index.md
          - Getting Started:
            - Quick Start: community/docs/getting-started.md
            - Installation: docs/installation.md
            - First Application: docs/tutorials/01-first-application.md
          - User Guide:
            - System Management: docs/user-guide/system-management.md
            - Package Management: docs/user-guide/package-management.md
            - Container Operations: docs/user-guide/container-operations.md
          - Developer Guide:
            - SDK Overview: docs/developer-guide/sdk-overview.md
            - Project Creation: docs/developer-guide/project-creation.md
            - Building Applications: docs/developer-guide/building-applications.md
            - Deployment: docs/developer-guide/deployment.md
          - Operations:
            - Cloud Deployment: docs/operations/cloud-deployment.md
            - Kubernetes Integration: docs/operations/kubernetes.md
            - Monitoring: docs/operations/monitoring.md
            - Security: docs/operations/security.md
          - Reference:
            - CLI Reference: docs/reference/cli.md
            - API Reference: docs/reference/api.md
            - Configuration: docs/reference/configuration.md
          - Community:
            - Contributing: community/CONTRIBUTING.md
            - Examples: community/examples/README.md
            - Support: community/support.md
        
        markdown_extensions:
          - admonition
          - codehilite
          - pymdownx.superfences:
              custom_fences:
                - name: mermaid
                  class: mermaid
                  format: !!python/name:mermaid2.fence_mermaid
          - pymdownx.tabbed
          - pymdownx.details
          - toc:
              permalink: true
        EOF
        
    - name: Create documentation index
      run: |
        cat > docs/index.md << 'EOF'
        # Ziro-OS Documentation
        
        Welcome to Ziro-OS, the container-native operating system built for cloud-native workloads.
        
        ## Quick Links
        
        - [Getting Started](community/docs/getting-started.md) - Start here if you're new to Ziro-OS
        - [First Application](tutorials/01-first-application.md) - Deploy your first app
        - [API Reference](reference/api.md) - Complete API documentation
        - [Examples](../community/examples/README.md) - Real-world examples
        
        ## What is Ziro-OS?
        
        Ziro-OS is a revolutionary container-native operating system that:
        
        - **Minimal by Design** - Only essential components included
        - **Container-First** - Built specifically for container workloads
        - **Cloud-Native** - Optimized for cloud deployment
        - **Secure** - Security hardening built-in
        - **Fast** - Sub-5 second boot times
        - **Extensible** - Plugin architecture for customization
        
        ## Architecture
        
        ```mermaid
        graph TB
            A[Applications] --> B[Container Runtime]
            B --> C[Ziro-OS Kernel]
            C --> D[Hardware/Cloud]
            
            B --> E[CNI Plugins]
            B --> F[CSI Drivers]
            B --> G[Device Plugins]
        ```
        
        ## Key Features
        
        ### ZiroPkg Package Manager
        Revolutionary container-native package management where packages ARE containers.
        
        ### Developer SDK
        Complete development workflow from project creation to production deployment.
        
        ### Multi-Cloud Support
        Deploy consistently across AWS, Azure, GCP, and on-premises.
        
        ### Kubernetes Integration
        Native Kubernetes support with optimized performance.
        
        ## Getting Help
        
        - [GitHub Issues](https://github.com/ziro-os/ziro-os/issues) - Bug reports and feature requests
        - [Discussions](https://github.com/ziro-os/ziro-os/discussions) - Community Q&A
        - [Discord](https://discord.gg/ziro-os) - Real-time chat
        - [Documentation](https://docs.ziro-os.io) - Complete documentation
        EOF
        
    - name: Build documentation
      run: mkdocs build
      
    - name: Upload documentation
      uses: actions/upload-artifact@v4
      with:
        name: documentation-site
        path: site/

  deploy-docs:
    name: Deploy Documentation
    runs-on: ubuntu-latest
    needs: build-docs
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Download documentation
      uses: actions/download-artifact@v3
      with:
        name: documentation-site
        path: site/
        
    - name: Deploy to GitHub Pages
      uses: peaceiris/actions-gh-pages@v3
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./site
        cname: docs.ziro-os.io

  update-readme:
    name: Update README Badges
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Update badges in README
      run: |
        # Update build status badge
        sed -i 's|!\[Build Status\].*|![Build Status](https://github.com/ziro-os/ziro-os/workflows/Ziro-OS%20CI/badge.svg)|' README.md
        
        # Update security badge
        sed -i 's|!\[Security\].*|![Security](https://github.com/ziro-os/ziro-os/workflows/Security%20Scan/badge.svg)|' README.md
        
        # Update documentation badge
        sed -i 's|!\[Documentation\].*|![Documentation](https://github.com/ziro-os/ziro-os/workflows/Documentation/badge.svg)|' README.md
        
    - name: Commit changes
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add README.md
        git commit -m "Update README badges [skip ci]" || exit 0
        git push