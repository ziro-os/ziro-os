name: Tools Release (ziroctl, ziropkg & zirocd)

# Publishes ziroctl and ziropkg on their own release stream (tags tools/vX.Y.Z), independent of
# OS releases. Hosts install them with `ziroctl update`, which accepts a release only if
# SHA256SUMS carries a valid signature from the Ziro release key (secret ZIRO_RELEASE_KEY,
# ed25519; public half in tools/ziroctl/cmd/update.go) and every binary matches it.
# Every OS release tag (vX.Y.Z) also publishes tools/vX.Y.Z, so the stream never falls behind.
# zirocd (the router client, Linux/macOS/Windows) ships here too and updates itself from it with
# the same signature check; Windows zips add the signed Wintun driver, pinned by SHA-256.
# The same Linux zirocd binaries are published as the container image ghcr.io/<owner>/zirocd
# (moons: `zirocd moon`), with a build provenance attestation.
on:
  push:
    tags:
      - 'tools/v*'
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tools version (e.g. v1.0.17)'
        required: true
      min_os:
        description: 'Oldest Ziro OS version these binaries run on'
        required: true
        default: '1.0.16'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write     # build provenance attestation
      attestations: write
      packages: write     # ghcr.io/<owner>/zirocd
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Version
        id: v
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          INPUT_MIN_OS: ${{ github.event.inputs.min_os }}
        run: |
          v="${INPUT_VERSION:-${GITHUB_REF_NAME#tools/}}"
          v="${v#v}"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version $v"; exit 1; }
          min_os="${INPUT_MIN_OS:-$(cat tools/MIN_OS)}"
          [[ "$min_os" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad min_os $min_os"; exit 1; }
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "min_os=$min_os" >> "$GITHUB_OUTPUT"

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: '1.27.x'
          cache-dependency-path: |
            tools/ziroctl/go.sum
            tools/ziropkg/go.sum
            tools/zirocd/go.sum

      - name: Test
        run: |
          (cd tools/ziroctl && go test ./...)
          (cd tools/zirocd && go test ./...)

      - name: Build
        env:
          VERSION: ${{ steps.v.outputs.version }}
          MIN_OS: ${{ steps.v.outputs.min_os }}
        run: |
          make tools-all zirocd-all VERSION="$VERSION"
          mkdir -p out
          cp bin/ziroctl-x86_64 bin/ziroctl-arm64 bin/ziropkg-x86_64 bin/ziropkg-arm64 bin/zirocd-* out/
          # Windows first install: zirocd.exe + wintun.dll (self-updates fetch only the .exe)
          curl -fsSLo /tmp/wintun.zip https://www.wintun.net/builds/wintun-0.14.1.zip
          echo "07c256185d6ee3652e09fa55c0b673e2624b565e02c4b9091c79ca7d2f24ef51  /tmp/wintun.zip" | sha256sum -c -
          unzip -q /tmp/wintun.zip -d /tmp
          for a in amd64 arm64; do
            d=$(mktemp -d)
            cp "out/zirocd-windows-$a.exe" "$d/zirocd.exe"
            cp "/tmp/wintun/bin/$a/wintun.dll" "$d/"
            cp /tmp/wintun/LICENSE.txt "$d/wintun-LICENSE.txt"
            (cd "$d" && zip -q "$GITHUB_WORKSPACE/out/zirocd-windows-$a.zip" zirocd.exe wintun.dll wintun-LICENSE.txt)
          done
          printf '{"version":"%s","min_os":"%s"}\n' "$VERSION" "$MIN_OS" > out/tools.json
          (cd out && sha256sum ziroctl-* ziropkg-* zirocd-* tools.json > SHA256SUMS && cat SHA256SUMS)

      - name: Sign SHA256SUMS
        env:
          ZIRO_RELEASE_KEY: ${{ secrets.ZIRO_RELEASE_KEY }}
        run: scripts/release/sign-sums.sh out

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            out/ziroctl-*
            out/ziropkg-*
            out/zirocd-*

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # FROM scratch with no RUN step: the multi-arch build copies the release binaries and needs
      # no emulation, so the image holds exactly the attested, signed binaries.
      - name: Build & push the zirocd image
        id: image
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          name="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/zirocd"
          ctx=$(mktemp -d)
          mkdir -p "$ctx/rootfs/var/lib/zirocd-moon"
          cp out/zirocd-linux-amd64 out/zirocd-linux-arm64 "$ctx/"
          docker buildx build --platform linux/amd64,linux/arm64 -f images/zirocd/Dockerfile \
            -t "$name:$VERSION" -t "$name:latest" --metadata-file /tmp/zirocd-image.json --push "$ctx"
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "digest=$(jq -r '."containerimage.digest"' /tmp/zirocd-image.json)" >> "$GITHUB_OUTPUT"

      - name: Attest image provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Publish
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: tools/v${{ steps.v.outputs.version }}
          name: "ziroctl, ziropkg & zirocd v${{ steps.v.outputs.version }}"
          make_latest: false # OS releases stay "latest"; ziroctl update lists tools/v* itself
          generate_release_notes: true
          files: |
            out/ziroctl-*
            out/ziropkg-*
            out/zirocd-*
            out/tools.json
            out/SHA256SUMS
            out/SHA256SUMS.sig
