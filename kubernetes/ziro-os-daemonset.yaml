# DaemonSet for Ziro-OS specific node configuration

apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ziro-os-node-setup
  namespace: kube-system
  labels:
    app: ziro-os-node-setup
spec:
  selector:
    matchLabels:
      app: ziro-os-node-setup
  template:
    metadata:
      labels:
        app: ziro-os-node-setup
    spec:
      hostNetwork: true
      hostPID: true
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      nodeSelector:
        kubernetes.io/os: linux
        node.kubernetes.io/instance-type: ziro-os
      containers:
      - name: node-setup
        image: alpine:3.18
        command:
        - /bin/sh
        - -c
        - |
          set -e
          echo "Configuring Ziro-OS node..."
          
          # Ensure CNI plugins are available
          if [ ! -f /host/opt/cni/bin/bridge ]; then
            echo "Installing CNI plugins..."
            mkdir -p /host/opt/cni/bin
            # CNI plugins would be copied here
          fi
          
          # Configure containerd for Kubernetes
          if [ ! -f /host/etc/containerd/config.toml.k8s ]; then
            echo "Configuring containerd for Kubernetes..."
            cp /etc/containerd-config/config.toml /host/etc/containerd/config.toml.k8s
          fi
          
          # Set up monitoring
          echo "Setting up node monitoring..."
          
          # Keep container running
          while true; do
            sleep 300
            echo "Ziro-OS node health check: $(date)"
          done
        securityContext:
          privileged: true
        volumeMounts:
        - name: host-root
          mountPath: /host
        - name: containerd-config
          mountPath: /etc/containerd-config
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
      volumes:
      - name: host-root
        hostPath:
          path: /
      - name: containerd-config
        configMap:
          name: ziro-os-containerd-config

---
apiVersion: v1
kind: Service
metadata:
  name: ziro-os-node-metrics
  namespace: kube-system
  labels:
    app: ziro-os-node-setup
spec:
  type: ClusterIP
  ports:
  - name: containerd-metrics
    port: 1338
    targetPort: 1338
    protocol: TCP
  selector:
    app: ziro-os-node-setup