# Ziro-OS Kubernetes Node Configuration

apiVersion: v1
kind: ConfigMap
metadata:
  name: ziro-os-node-config
  namespace: kube-system
data:
  # Kubelet configuration for Ziro-OS nodes
  kubelet-config.yaml: |
    apiVersion: kubelet.config.k8s.io/v1beta1
    kind: KubeletConfiguration
    
    # Container runtime configuration
    containerRuntimeEndpoint: "unix:///run/containerd/containerd.sock"
    
    # Ziro-OS specific settings
    cgroupDriver: "systemd"
    failSwapOn: false
    
    # Resource management
    kubeReserved:
      cpu: "100m"
      memory: "128Mi"
      ephemeral-storage: "1Gi"
    systemReserved:
      cpu: "100m"
      memory: "128Mi"
      ephemeral-storage: "1Gi"
    
    # Networking
    clusterDNS:
      - "10.96.0.10"
    clusterDomain: "cluster.local"
    
    # Security
    authentication:
      anonymous:
        enabled: false
      webhook:
        enabled: true
    authorization:
      mode: Webhook
    
    # Logging
    logging:
      format: json
    
    # Feature gates for container optimizations
    featureGates:
      KubeletInUserNamespace: true
      SeccompDefault: true
