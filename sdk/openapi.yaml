openapi: 3.1.0
info:
  title: Ziro OS API
  version: "1"
  summary: Manage a Ziro OS host or cluster master (ziroctl api)
  description: |
    The API server (`ziroctl api start`) listens on loopback by default (HTTPS optional).
    Authenticate with `Authorization: Bearer <token>` (`ziroctl api token`, or scoped tokens from
    `ziroctl api token create <name> --role viewer|operator|admin`).

    Roles: each operation states the role it needs in `x-ziro-role` (the server enforces exactly
    that). **viewer** reads; **operator** also runs day-to-day changes (services, containers, DNS
    records, scaling, node cordon/drain); **admin** may do everything, including what grants or
    removes access, installs software, deletes data or changes where traffic goes. Requests are
    rate limited (120/min per client, 600/min per token) and every change is audited
    (`GET /api/v1/events` streams the audit trail). Errors are `{"status": "error", "code", "message"}`.

    Long jobs (module enable, app deploy) answer `202 Accepted` and run in the background; poll the
    matching GET. The Go client is `github.com/ziro-os/ziro-os/sdk/client`.
  license:
    name: MIT
servers:
  - url: https://127.0.0.1:8443
security:
  - bearer: []
tags:
  - name: host
  - name: security
  - name: network
  - name: storage
  - name: modules
  - name: apps
  - name: gateway
  - name: cluster
  - name: stacks

paths:
  /api/v1/health:
    get:
      x-ziro-role: public
      tags: [host]
      summary: Liveness (no token needed)
      security: []
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/system:
    get:
      x-ziro-role: viewer
      tags: [host]
      summary: Host metrics and cloud metadata
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/system/top:
    get:
      x-ziro-role: viewer
      tags: [host]
      summary: Resource use of containers (from their cgroups) and processes, sampled over one second
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/system/df:
    get:
      x-ziro-role: viewer
      tags: [host]
      summary: Disk usage by category and how much a prune can reclaim
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/system/prune:
    post:
      x-ziro-role: admin
      tags: [host]
      summary: Plan (default) or, with confirm, remove unused containers, images, rotated logs, stale temp files and caches (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                categories: { type: array, items: { type: string, enum: [containers, images, logs, tmp, cache, rollback] } }
                all: { type: boolean, description: Also remove the upgrade rollback generation }
                confirm: { type: boolean, description: Remove (otherwise only plan) }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/system/reboot:
    post:
      x-ziro-role: admin
      tags: [host]
      summary: Reboot the host after replying (admin)
      responses:
        "202": { $ref: "#/components/responses/Message" }
  /api/v1/system/poweroff:
    post:
      x-ziro-role: admin
      tags: [host]
      summary: Power the host off after replying (admin)
      responses:
        "202": { $ref: "#/components/responses/Message" }
  /api/v1/system/update:
    get:
      x-ziro-role: viewer
      tags: [host]
      summary: Last ziroctl/ziropkg update check (refresh=true checks now)
      parameters:
        - { name: refresh, in: query, schema: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
    post:
      x-ziro-role: admin
      tags: [host]
      summary: Install the newest signed tools release in the background (admin)
      responses:
        "202": { $ref: "#/components/responses/Message" }
  /api/v1/metrics:
    get:
      x-ziro-role: viewer
      tags: [host]
      summary: Prometheus metrics (text format)
      responses:
        "200":
          description: Prometheus exposition format
          content:
            text/plain: { schema: { type: string } }
  /api/v1/services:
    get:
      x-ziro-role: viewer
      tags: [host]
      summary: Services and their status
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/services/{name}/{action}:
    post:
      x-ziro-role: operator
      tags: [host]
      summary: Start, stop, restart, enable or disable a service (operator)
      parameters:
        - $ref: "#/components/parameters/Name"
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [start, stop, restart, enable, disable] }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/containers:
    get:
      x-ziro-role: viewer
      tags: [host]
      summary: Containers on this host
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/firewall:
    get:
      x-ziro-role: viewer
      tags: [security]
      summary: Firewall status and rules
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/wireguard:
    get:
      x-ziro-role: viewer
      tags: [network]
      summary: WireGuard status
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/cluster:
    get:
      x-ziro-role: viewer
      tags: [cluster]
      summary: Cluster nodes, apps and replicas
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/security:
    get:
      x-ziro-role: viewer
      tags: [security]
      summary: Security scan report
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/security/protect:
    get:
      x-ziro-role: viewer
      tags: [security]
      summary: Protection settings (SSH auto-ban, scan and flood guards)
      responses:
        "200": { $ref: "#/components/responses/Object" }
    put:
      x-ziro-role: admin
      tags: [security]
      summary: Replace the protection settings (validated and applied like `security protect set`)
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/security/bans:
    get:
      x-ziro-role: viewer
      tags: [security]
      summary: Banned addresses
      responses:
        "200": { $ref: "#/components/responses/Object" }
    post:
      x-ziro-role: admin
      tags: [security]
      summary: Ban an address (operator)
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/security/bans/{ip}:
    delete:
      x-ziro-role: admin
      tags: [security]
      summary: Lift a ban (operator)
      parameters:
        - name: ip
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/security/alerting:
    get:
      x-ziro-role: admin
      tags: [security]
      summary: Alert webhooks
      responses:
        "200": { $ref: "#/components/responses/Object" }
    post:
      x-ziro-role: admin
      tags: [security]
      summary: Add a webhook (admin)
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/security/alerting/{name}:
    delete:
      x-ziro-role: admin
      tags: [security]
      summary: Remove a webhook (admin)
      parameters: [{ $ref: "#/components/parameters/Name" }]
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/security/alerting/{name}/test:
    post:
      x-ziro-role: admin
      tags: [security]
      summary: Send a test alert to a webhook (admin)
      parameters: [{ $ref: "#/components/parameters/Name" }]
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/network:
    get:
      x-ziro-role: viewer
      tags: [network]
      summary: Network configuration (applied and pending)
      responses:
        "200": { $ref: "#/components/responses/Object" }
    put:
      x-ziro-role: admin
      tags: [network]
      summary: Replace and apply the network configuration; rolls back unless confirmed (admin)
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/disks:
    get:
      x-ziro-role: viewer
      tags: [storage]
      summary: Disks and filesystems
      responses:
        "200": { $ref: "#/components/responses/Object" }
    post:
      x-ziro-role: admin
      tags: [storage]
      summary: Format and mount a data disk, {"device","mount"} (admin)
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/disks/expand:
    post:
      x-ziro-role: admin
      tags: [storage]
      summary: Grow the root filesystem to its disk (admin)
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/ssh/keys:
    get:
      x-ziro-role: admin
      tags: [security]
      summary: Authorized SSH keys
      responses:
        "200": { $ref: "#/components/responses/Object" }
    post:
      x-ziro-role: admin
      tags: [security]
      summary: Import keys, {"source":"gh:alice","sync":false} (admin)
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
    delete:
      x-ziro-role: admin
      tags: [security]
      summary: Remove keys imported from a source (admin)
      parameters:
        - name: source
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/dns:
    get:
      x-ziro-role: viewer
      tags: [network]
      summary: Smart DNS configuration and statistics
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/dns/records:
    post:
      x-ziro-role: operator
      tags: [network]
      summary: Add a DNS record (operator)
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
    delete:
      x-ziro-role: operator
      tags: [network]
      summary: Remove a DNS record (operator)
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/dns/block:
    put:
      x-ziro-role: operator
      tags: [network]
      summary: Replace blocklists (operator)
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/dns/upstreams:
    put:
      x-ziro-role: admin
      tags: [network]
      summary: Replace upstream resolvers (admin)
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/dns/forwards:
    put:
      x-ziro-role: admin
      tags: [network]
      summary: Replace split-DNS forwards (admin)
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/modules:
    get:
      x-ziro-role: viewer
      tags: [modules]
      summary: Built-in and catalog modules (plugins) with their status
      responses:
        "200":
          description: Modules
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ModuleInfo" } }
  /api/v1/modules/{name}/{action}:
    post:
      x-ziro-role: admin
      tags: [modules]
      summary: Enable, upgrade, disable or purge a module in the background (admin)
      parameters:
        - $ref: "#/components/parameters/Name"
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [enable, upgrade, disable, purge] }
      responses:
        "202": { $ref: "#/components/responses/Message" }
        "404": { $ref: "#/components/responses/Message" }
  /api/v1/apps:
    get:
      x-ziro-role: viewer
      tags: [apps]
      summary: Deployed apps and how many replicas run
      responses:
        "200":
          description: Apps
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AppStatus" } }
  /api/v1/apps/deploy:
    post:
      x-ziro-role: admin
      tags: [apps]
      summary: Deploy (or update) an app from a catalog in the background (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppDeployRequest" }
      responses:
        "202": { $ref: "#/components/responses/Message" }
  /api/v1/apps/{name}:
    delete:
      x-ziro-role: admin
      tags: [apps]
      summary: Remove an app; purge=true also deletes its data and credentials (admin)
      parameters:
        - $ref: "#/components/parameters/Name"
        - { name: purge, in: query, schema: { type: boolean } }
      responses:
        "202": { $ref: "#/components/responses/Message" }
  /api/v1/nfs:
    get:
      x-ziro-role: viewer
      tags: [storage]
      summary: NFS exports and mounts
      responses:
        "200":
          description: NFS configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NFSConfig" }
  /api/v1/nfs/clients:
    get:
      x-ziro-role: viewer
      tags: [storage]
      summary: NFS clients connected to this server
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/NFSClient" } }
  /api/v1/gateway/routes:
    get:
      x-ziro-role: viewer
      tags: [gateway]
      summary: Routes with their resolved upstreams
      responses:
        "200":
          description: Routes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/GatewayRouteState" } }
    post:
      x-ziro-role: admin
      tags: [gateway]
      summary: Create or replace a route (admin; live within a second)
      requestBody: { $ref: "#/components/requestBodies/GatewayRoute" }
      responses:
        "200": { description: The stored route, content: { application/json: { schema: { $ref: "#/components/schemas/GatewayRoute" } } } }
        "400": { $ref: "#/components/responses/Message" }
  /api/v1/gateway/routes/{name}:
    get:
      x-ziro-role: viewer
      tags: [gateway]
      summary: One route
      parameters: [{ $ref: "#/components/parameters/Name" }]
      responses:
        "200": { description: Route, content: { application/json: { schema: { $ref: "#/components/schemas/GatewayRouteState" } } } }
    put:
      x-ziro-role: admin
      tags: [gateway]
      summary: Create or replace this route (admin)
      parameters: [{ $ref: "#/components/parameters/Name" }]
      requestBody: { $ref: "#/components/requestBodies/GatewayRoute" }
      responses:
        "200": { description: The stored route, content: { application/json: { schema: { $ref: "#/components/schemas/GatewayRoute" } } } }
        "400": { $ref: "#/components/responses/Message" }
    delete:
      x-ziro-role: admin
      tags: [gateway]
      summary: Remove this route (admin)
      parameters: [{ $ref: "#/components/parameters/Name" }]
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/gateway/status:
    get:
      x-ziro-role: viewer
      tags: [gateway]
      summary: Upstream health, active connections and requests per route
      responses:
        "200": { description: Status, content: { application/json: { schema: { $ref: "#/components/schemas/GatewayStatus" } } } }
  /api/v1/gateway/ca:
    get:
      x-ziro-role: viewer
      tags: [gateway]
      summary: The internal CA certificate (PEM) to trust for `tls internal` routes
      responses:
        "200": { description: PEM, content: { application/x-pem-file: { schema: { type: string } } } }
  /api/v1/gateway/certs:
    get:
      x-ziro-role: viewer
      tags: [gateway]
      summary: Names of uploaded certificates
      responses:
        "200": { description: Names, content: { application/json: { schema: { type: array, items: { type: string } } } } }
    post:
      x-ziro-role: admin
      tags: [gateway]
      summary: Upload a certificate, {"name","cert","key"} PEM (admin)
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/gateway/certs/{name}:
    delete:
      x-ziro-role: admin
      tags: [gateway]
      summary: Remove a certificate (refused while a route uses it; admin)
      parameters: [{ $ref: "#/components/parameters/Name" }]
      responses:
        "200": { $ref: "#/components/responses/Message" }

  /api/v1/apps/catalog:
    get:
      x-ziro-role: viewer
      tags: [apps]
      summary: Search the app catalogs (?q=)
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/apps/catalog/{app}:
    get:
      x-ziro-role: viewer
      tags: [apps]
      summary: An app definition from the catalogs
      parameters:
        - { name: app, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/audit:
    get:
      x-ziro-role: admin
      tags: [security]
      summary: Latest audit records (?limit=, ?since= RFC 3339)
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/audit/verify:
    get:
      x-ziro-role: admin
      tags: [security]
      summary: Verify the audit hash chain
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/backups:
    get:
      x-ziro-role: operator
      tags: [storage]
      summary: Backup archives
      responses:
        "200": { $ref: "#/components/responses/Object" }
    post:
      x-ziro-role: admin
      tags: [storage]
      summary: Create a backup in the background
      responses:
        "202": { $ref: "#/components/responses/Message" }
  /api/v1/backups/{name}/restore:
    post:
      x-ziro-role: admin
      tags: [storage]
      summary: Restore a backup in the background
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "202": { $ref: "#/components/responses/Message" }
  /api/v1/cluster/apps:
    post:
      x-ziro-role: admin
      tags: [cluster]
      summary: Create or replace a cluster app from its full spec (cluster apply)
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/cluster/apps/{name}:
    delete:
      x-ziro-role: admin
      tags: [cluster]
      summary: Remove a cluster app and its replicas
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/cluster/apps/{name}/rollback:
    post:
      x-ziro-role: operator
      tags: [cluster]
      summary: Roll an app back to its previous revision
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/cluster/apps/{name}/scale:
    post:
      x-ziro-role: operator
      tags: [cluster]
      summary: 'Scale an app, {"replicas": n}'
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/cluster/nodes/{id}:
    delete:
      x-ziro-role: admin
      tags: [cluster]
      summary: Remove a worker and revoke its credentials
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/cluster/nodes/{id}/{action}:
    post:
      x-ziro-role: operator
      tags: [cluster]
      summary: Cordon, uncordon or drain a node
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/cluster/secrets:
    get:
      x-ziro-role: admin
      tags: [cluster]
      summary: Secret names and keys (never values)
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/cluster/secrets/{name}:
    put:
      x-ziro-role: admin
      tags: [cluster]
      summary: 'Create or replace a secret, {"KEY": "value"} (write-only)'
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
    delete:
      x-ziro-role: admin
      tags: [cluster]
      summary: Delete a secret no app uses
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/containers/{id}:
    get:
      x-ziro-role: viewer
      tags: [host]
      summary: Inspect a container
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
    delete:
      x-ziro-role: operator
      tags: [host]
      summary: 'Remove a stopped container (not an app or cluster container: 409)'
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/containers/{id}/logs:
    get:
      x-ziro-role: operator
      tags: [host]
      summary: The last ?lines= of a container log
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/containers/{id}/{action}:
    post:
      x-ziro-role: operator
      tags: [host]
      summary: Start, stop or restart a container
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - { name: action, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/events:
    get:
      x-ziro-role: operator
      tags: [host]
      summary: 'Server-sent events: every audited change as it happens (text/event-stream)'
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/firewall/allow:
    post:
      x-ziro-role: admin
      tags: [security]
      summary: 'Allow inbound traffic on a port, {"port": "443/tcp"}'
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/firewall/block:
    post:
      x-ziro-role: admin
      tags: [security]
      summary: 'Block an IP or CIDR, {"target": "203.0.113.0/24"}'
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/firewall/deny:
    post:
      x-ziro-role: admin
      tags: [security]
      summary: 'Remove a port from the allow list, {"port": "443/tcp"}'
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/firewall/disable:
    post:
      x-ziro-role: admin
      tags: [security]
      summary: Disable the firewall (all inbound traffic allowed)
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/firewall/enable:
    post:
      x-ziro-role: admin
      tags: [security]
      summary: Enable the firewall
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/firewall/unblock:
    post:
      x-ziro-role: admin
      tags: [security]
      summary: Unblock an IP or CIDR
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/images:
    get:
      x-ziro-role: viewer
      tags: [host]
      summary: Container images
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/images/pull:
    post:
      x-ziro-role: operator
      tags: [host]
      summary: 'Pull an image in the background, {"image": "..."}'
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "202": { $ref: "#/components/responses/Message" }
  /api/v1/modules/catalog:
    get:
      x-ziro-role: viewer
      tags: [modules]
      summary: Search built-in and catalog modules (?q=)
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/modules/catalog/{name}:
    get:
      x-ziro-role: viewer
      tags: [modules]
      summary: A module manifest
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/network/confirm:
    post:
      x-ziro-role: admin
      tags: [network]
      summary: Confirm an applied network change (stops the rollback timer)
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/network/dns:
    post:
      x-ziro-role: admin
      tags: [network]
      summary: 'Pin resolvers, {"servers": [...], "search": [...]}; empty follows DHCP'
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/network/hostname:
    post:
      x-ziro-role: admin
      tags: [network]
      summary: 'Set the hostname, {"hostname": "..."}'
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/repos:
    get:
      x-ziro-role: viewer
      tags: [modules]
      summary: Catalog repositories
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/services/{name}:
    get:
      x-ziro-role: viewer
      tags: [host]
      summary: One service and its status
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/services/{name}/logs:
    get:
      x-ziro-role: operator
      tags: [host]
      summary: The last ?lines= of a service log
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/tokens:
    get:
      x-ziro-role: admin
      tags: [security]
      summary: API tokens (never the tokens themselves)
      responses:
        "200": { $ref: "#/components/responses/Object" }
    post:
      x-ziro-role: admin
      tags: [security]
      summary: 'Create a token, {"name","role","ttl"}; the token is returned once'
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/tokens/{name}:
    delete:
      x-ziro-role: admin
      tags: [security]
      summary: 'Revoke a token ("legacy" revokes the bootstrap admin token for good)'
      parameters:
        - { name: name, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/upgrade:
    get:
      x-ziro-role: viewer
      tags: [host]
      summary: Installed and latest OS release
      responses:
        "200": { $ref: "#/components/responses/Object" }
    post:
      x-ziro-role: admin
      tags: [host]
      summary: 'Upgrade the OS in the background, {"version", "reboot"}'
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "202": { $ref: "#/components/responses/Message" }
  /api/v1/upgrade/rollback:
    post:
      x-ziro-role: admin
      tags: [host]
      summary: Roll the last OS upgrade back (takes effect at reboot)
      responses:
        "202": { $ref: "#/components/responses/Message" }
  /api/v1/stacks:
    get:
      x-ziro-role: viewer
      tags: [stacks]
      summary: Deployed stacks; ?source=catalog lists the stacks published in the signed app catalogs
      parameters:
        - { name: source, in: query, schema: { type: string, enum: [catalog] } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/stacks/{name}:
    get:
      x-ziro-role: viewer
      tags: [stacks]
      summary: A stack and the status of each of its apps
      parameters:
        - $ref: "#/components/parameters/Name"
      responses:
        "200": { $ref: "#/components/responses/Object" }
    put:
      x-ziro-role: admin
      tags: [stacks]
      summary: Apply a stack in the background (catalog apps only); the body's stack name must match the URL
      parameters:
        - $ref: "#/components/parameters/Name"
      requestBody: { $ref: "#/components/requestBodies/Stack" }
      responses:
        "202": { $ref: "#/components/responses/Message" }
    delete:
      x-ziro-role: admin
      tags: [stacks]
      summary: Remove a stack's apps in the background (?purge=true also deletes their data)
      parameters:
        - $ref: "#/components/parameters/Name"
      responses:
        "202": { $ref: "#/components/responses/Message" }
  /api/v1/stacks/{name}/plan:
    post:
      x-ziro-role: operator
      tags: [stacks]
      summary: What applying this stack would create, update, keep or remove
      parameters:
        - $ref: "#/components/parameters/Name"
      requestBody: { $ref: "#/components/requestBodies/Stack" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/apply:
    post:
      x-ziro-role: admin
      tags: [host]
      summary: Make the host match a host config ({"host":{...}}); ?dry_run=true returns the plan, otherwise it applies in the background
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "202": { $ref: "#/components/responses/Message" }
  /api/v1/deployments:
    get:
      x-ziro-role: viewer
      tags: [deploy]
      summary: Apps deployed from git, each with its URL and latest build
      responses:
        "200": { $ref: "#/components/responses/Object" }
    post:
      x-ziro-role: admin
      tags: [deploy]
      summary: Create or update a deployment from a git repository and queue its build (needs the builder plugin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeployRequest" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/deployments/{app}:
    get:
      x-ziro-role: viewer
      tags: [deploy]
      summary: A deployment and its builds, newest first
      parameters:
        - $ref: "#/components/parameters/App"
      responses:
        "200": { $ref: "#/components/responses/Object" }
    delete:
      x-ziro-role: admin
      tags: [deploy]
      summary: Remove a deployment, its builds and its app (?purge=true also deletes the app's data and secrets)
      parameters:
        - $ref: "#/components/parameters/App"
        - { name: purge, in: query, schema: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/deployments/{app}/redeploy:
    post:
      x-ziro-role: operator
      tags: [deploy]
      summary: Build the latest commit again ({"ref":"<branch>"} switches the branch) and release it
      parameters:
        - $ref: "#/components/parameters/App"
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/deployments/{app}/rollback:
    post:
      x-ziro-role: operator
      tags: [deploy]
      summary: Release an earlier build's image again ({"build":"b3"}, default the previous one), without rebuilding
      parameters:
        - $ref: "#/components/parameters/App"
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/hooks/deploy/{app}:
    post:
      x-ziro-role: public
      tags: [deploy]
      summary: Git push webhook (GitHub X-Hub-Signature-256 or GitLab X-Gitlab-Token, from ziroctl deploy hook); a push to the deployment's branch builds and releases it
      security: []
      parameters:
        - $ref: "#/components/parameters/App"
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "202": { $ref: "#/components/responses/Message" }
  /api/v1/deployments/{app}/builds/{id}/log:
    get:
      x-ziro-role: viewer
      tags: [deploy]
      summary: A build's log as text; ?follow=true streams it until the build finishes
      parameters:
        - $ref: "#/components/parameters/App"
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^b[0-9]{1,9}$" } }
        - { name: follow, in: query, schema: { type: boolean } }
      responses:
        "200": { description: The log, content: { text/plain: { schema: { type: string } } } }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    App:
      name: app
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9_.-]{0,62}$" }
    Name:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9_.-]{0,62}$" }
  requestBodies:
    Stack:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Stack" }
    Object:
      content:
        application/json:
          schema: { type: object }
    GatewayRoute:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GatewayRoute" }
  responses:
    Object:
      description: JSON object
      content:
        application/json:
          schema: { type: object }
    Message:
      description: Result
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
  schemas:
    DeployRequest:
      type: object
      required: [name, repo]
      additionalProperties: false
      properties:
        name: { type: string }
        repo: { type: string, description: https URL without credentials }
        ref: { type: string, description: branch or tag }
        path: { type: string, description: subdirectory to build }
        port: { type: integer }
        publish: { type: integer, description: host port on 127.0.0.1 }
        env: { type: object, additionalProperties: { type: string } }
        secrets: { type: array, items: { type: string }, description: names of input secrets the app receives }
        secret_values: { type: object, additionalProperties: { type: string }, description: values for those secrets (kept by the app) }
        git_token: { type: string, description: access token for a private repository (stored 0600) }
        expose: { type: string }
        expose_tls: { type: string }
        resources: { type: object }
    Stack:
      type: object
      required: [stack, version, apps]
      additionalProperties: false
      properties:
        stack: { type: string, description: the stack's name }
        version: { type: integer, enum: [1] }
        description: { type: string }
        apps:
          type: object
          additionalProperties:
            type: object
            required: [app]
            additionalProperties: false
            properties:
              app: { type: string, description: "catalog name[:version]" }
              set: { type: object, additionalProperties: { type: string } }
              replicas: { type: integer }
              publish: { type: integer }
              expose: { type: string }
              expose_tls: { type: string }
              resources: { type: object, properties: { memory: { type: string }, cpus: { type: number }, pids: { type: integer } } }
              depends_on: { type: array, items: { type: string } }
    Message:
      type: object
      properties:
        status: { type: string, enum: [ok, error, accepted] }
        code: { type: string, description: "errors: invalid, unauthorized, forbidden, not_found, method_not_allowed, conflict, too_large, rate_limited, internal" }
        message: { type: string }
    ModuleInfo:
      type: object
      properties:
        name: { type: string }
        version: { type: string }
        available: { type: string, description: newer version in a catalog }
        description: { type: string }
        source: { type: string, description: builtin, a catalog repo, or local }
        requires: { type: array, items: { type: string } }
        status: { type: string, enum: [available, installing, enabled, failed, disabling] }
        error: { type: string }
        auto: { type: boolean }
    AppStatus:
      type: object
      properties:
        name: { type: string }
        app: { type: string }
        version: { type: string }
        mode: { type: string, enum: [local, cluster] }
        publish: { type: string }
        components: { type: array, items: { type: string } }
        running: { type: string, examples: ["3/3"] }
    AppDeployRequest:
      type: object
      required: [app]
      properties:
        app: { type: string, examples: ["postgres:18"] }
        name: { type: string }
        set: { type: object, additionalProperties: { type: string } }
        replicas: { type: integer }
        publish: { type: integer }
        allow_from: { type: array, items: { type: string } }
        expose: { type: string, description: publish through the gateway on this hostname }
        expose_tls: { type: string, examples: [auto, internal, off, "cert:name"] }
        secrets: { type: object, additionalProperties: { type: string }, description: values for the app's input secrets (see apps info) }
    NFSExport:
      type: object
      properties:
        path: { type: string }
        clients: { type: array, items: { type: string } }
        read_only: { type: boolean }
        squash: { type: string, enum: [root, all, none] }
        owner: { type: string, examples: ["1000:1000"] }
    NFSConfig:
      type: object
      properties:
        exports: { type: array, items: { $ref: "#/components/schemas/NFSExport" } }
        mounts: { type: array, items: { type: object } }
    NFSClient:
      type: object
      properties:
        address: { type: string }
        name: { type: string }
        minor_version: { type: string }
        status: { type: string }
        open_files: { type: integer }
        exports: { type: array, items: { type: string } }
    GatewayUpstream:
      type: object
      properties:
        app: { type: string }
        address: { type: string, description: "IP:port" }
        weight: { type: integer, minimum: 1, maximum: 1000 }
    GatewayRoute:
      type: object
      description: A routing rule. Exactly one of to, redirect, respond.
      properties:
        name: { type: string }
        kind: { type: string, enum: [http, tcp, tls], default: http }
        hosts: { type: array, items: { type: string }, description: 'exact names or "*.domain" (one label)' }
        path_prefix: { type: string, default: / }
        path_exact: { type: boolean }
        methods: { type: array, items: { type: string } }
        headers: { type: object, additionalProperties: { type: string } }
        listen: { type: integer, description: port of a tcp route }
        to: { type: array, items: { $ref: "#/components/schemas/GatewayUpstream" } }
        lb: { type: string, enum: [round_robin, least_conn, ip_hash, cookie] }
        health:
          type: object
          properties:
            path: { type: string }
            interval: { type: string, examples: [10s] }
            expect: { type: integer }
        redirect: { type: string, description: '"{uri}" is the request URI' }
        redirect_code: { type: integer, enum: [301, 302, 307, 308] }
        respond:
          type: object
          properties:
            status: { type: integer }
            body: { type: string }
        strip_prefix: { type: string }
        request_headers: { $ref: "#/components/schemas/HeaderRules" }
        response_headers: { $ref: "#/components/schemas/HeaderRules" }
        retries: { type: integer, minimum: 0, maximum: 5 }
        timeout: { type: string }
        compress: { type: boolean }
        tls: { type: string, examples: [auto, off, internal, "cert:name"] }
        allow_cidrs: { type: array, items: { type: string } }
        rate_rps: { type: integer }
        max_body_mb: { type: integer }
        basic_auth: { type: object, additionalProperties: { type: string }, description: user -> bcrypt hash }
    HeaderRules:
      type: object
      properties:
        set: { type: object, additionalProperties: { type: string } }
        remove: { type: array, items: { type: string } }
    GatewayRouteState:
      allOf:
        - $ref: "#/components/schemas/GatewayRoute"
        - type: object
          properties:
            upstreams: { type: array, items: { type: string } }
            targets:
              type: array
              items:
                type: object
                properties:
                  addr: { type: string }
                  weight: { type: integer }
    GatewayStatus:
      type: object
      properties:
        routes:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              kind: { type: string }
              match: { type: string }
              tls: { type: string }
              upstreams:
                type: array
                items:
                  type: object
                  properties:
                    addr: { type: string }
                    share: { type: integer, description: percent of the route's traffic }
                    healthy: { type: boolean }
                    active: { type: integer }
              requests: { type: object, additionalProperties: { type: integer } }
        internal_ca: { type: string }
