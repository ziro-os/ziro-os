openapi: 3.1.0
info:
  title: Ziro OS API
  version: "1"
  summary: Manage a Ziro OS host or cluster master (ziroctl api)
  description: |
    The API server (`ziroctl api start`) listens on loopback by default (HTTPS optional).
    Authenticate with `Authorization: Bearer <token>` (`ziroctl api token`, or scoped tokens from
    `ziroctl api token create <name> --role viewer|deployer|operator|admin`). A token can also be
    limited to API areas with `--scope` (e.g. `--scope sandboxes` for an AI agent's token).

    Roles: each operation states the role it needs in `x-ziro-role` (the server enforces exactly
    that). **viewer** reads; **deployer** also pushes source and redeploys or rolls back deployments (CI and agents); **operator** also runs day-to-day changes (services, containers, DNS
    records, scaling, node cordon/drain); **admin** may do everything, including what grants or
    removes access, installs software, deletes data or changes where traffic goes. Requests are
    rate limited (120/min per client, 600/min per token) and every change is audited
    (`GET /api/v1/events` streams the audit trail). Errors are `{"status": "error", "code", "message"}`.

    Every answer carries `X-Request-Id`: the client's own when it sends one (1-64 characters of
    `A-Za-z0-9._-`), otherwise a new one. It is recorded with each change in the audit trail and
    passed on to the cluster node that serves a forwarded request. `GET /api/v1/whoami` and
    `GET /api/v1/openapi.yaml` (this document) work with any valid token, whatever its scopes.

    Long jobs (module enable, app deploy) answer `202 Accepted` and run in the background; poll the
    matching GET. The Go client is `github.com/ziro-os/ziro-os/sdk/client`.
  license:
    name: MIT
servers:
  - url: https://127.0.0.1:8443
security:
  - bearer: []
tags:
  - name: host
  - name: security
  - name: network
  - name: storage
  - name: modules
  - name: apps
  - name: pg
  - name: gateway
  - name: dns
  - name: cluster
  - name: stacks
  - name: sandboxes

paths:
  /api/v1/health:
    get:
      x-ziro-role: public
      tags: [host]
      summary: Liveness (no token needed); version is the tools version (X.Y.Z or X.Y.Z.N), os_version the installed Ziro OS
      security: []
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/system:
    get:
      x-ziro-role: viewer
      tags: [host]
      summary: Host metrics and cloud metadata
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/system/top:
    get:
      x-ziro-role: viewer
      tags: [host]
      summary: Resource use of containers (from their cgroups) and processes, sampled over one second
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/system/df:
    get:
      x-ziro-role: viewer
      tags: [host]
      summary: Disk usage by category and how much a prune can reclaim
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/system/prune:
    post:
      x-ziro-role: admin
      tags: [host]
      summary: Plan (default) or, with confirm, remove unused containers, images, rotated logs, stale temp files and caches (admin)
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                categories: { type: array, items: { type: string, enum: [containers, images, logs, tmp, cache, rollback] } }
                all: { type: boolean, description: Also remove the upgrade rollback generation }
                confirm: { type: boolean, description: Remove (otherwise only plan) }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/system/reboot:
    post:
      x-ziro-role: admin
      tags: [host]
      summary: Reboot the host after replying (admin)
      responses:
        "202": { $ref: "#/components/responses/Message" }
  /api/v1/system/poweroff:
    post:
      x-ziro-role: admin
      tags: [host]
      summary: Power the host off after replying (admin)
      responses:
        "202": { $ref: "#/components/responses/Message" }
  /api/v1/system/update:
    get:
      x-ziro-role: viewer
      tags: [host]
      summary: Last ziroctl/ziropkg update check (refresh=true checks now)
      parameters:
        - { name: refresh, in: query, schema: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
    post:
      x-ziro-role: admin
      tags: [host]
      summary: Install the newest signed tools release in the background (admin)
      responses:
        "202": { $ref: "#/components/responses/Message" }
  /api/v1/metrics:
    get:
      x-ziro-role: viewer
      tags: [host]
      summary: Prometheus metrics (text format)
      responses:
        "200":
          description: Prometheus exposition format
          content:
            text/plain: { schema: { type: string } }
  /api/v1/services:
    get:
      x-ziro-role: viewer
      tags: [host]
      summary: Services and their status
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/services/{name}/{action}:
    post:
      x-ziro-role: operator
      tags: [host]
      summary: Start, stop, restart, enable or disable a service (operator)
      parameters:
        - $ref: "#/components/parameters/Name"
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [start, stop, restart, enable, disable] }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/containers:
    get:
      x-ziro-role: viewer
      tags: [host]
      summary: Containers on this host
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/firewall:
    get:
      x-ziro-role: viewer
      tags: [security]
      summary: Firewall status and rules
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/wireguard:
    get:
      x-ziro-role: viewer
      tags: [network]
      summary: WireGuard status
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/cluster:
    get:
      x-ziro-role: viewer
      tags: [cluster]
      summary: Cluster nodes, apps and replicas
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/security:
    get:
      x-ziro-role: viewer
      tags: [security]
      summary: Security scan report
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/security/protect:
    get:
      x-ziro-role: viewer
      tags: [security]
      summary: Protection settings (SSH auto-ban, scan and flood guards)
      responses:
        "200": { $ref: "#/components/responses/Object" }
    put:
      x-ziro-role: admin
      tags: [security]
      summary: Replace the protection settings (validated and applied like `security protect set`)
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/security/bans:
    get:
      x-ziro-role: viewer
      tags: [security]
      summary: Banned addresses
      responses:
        "200": { $ref: "#/components/responses/Object" }
    post:
      x-ziro-role: admin
      tags: [security]
      summary: Ban an address (operator)
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/security/bans/{ip}:
    delete:
      x-ziro-role: admin
      tags: [security]
      summary: Lift a ban (operator)
      parameters:
        - name: ip
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/security/alerting:
    get:
      x-ziro-role: admin
      tags: [security]
      summary: Alert webhooks
      responses:
        "200": { $ref: "#/components/responses/Object" }
    post:
      x-ziro-role: admin
      tags: [security]
      summary: Add a webhook (admin)
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/security/alerting/{name}:
    delete:
      x-ziro-role: admin
      tags: [security]
      summary: Remove a webhook (admin)
      parameters: [{ $ref: "#/components/parameters/Name" }]
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/security/alerting/{name}/test:
    post:
      x-ziro-role: admin
      tags: [security]
      summary: Send a test alert to a webhook (admin)
      parameters: [{ $ref: "#/components/parameters/Name" }]
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/network:
    get:
      x-ziro-role: viewer
      tags: [network]
      summary: Network configuration (applied and pending)
      responses:
        "200": { $ref: "#/components/responses/Object" }
    put:
      x-ziro-role: admin
      tags: [network]
      summary: Replace and apply the network configuration; rolls back unless confirmed (admin)
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/disks:
    get:
      x-ziro-role: viewer
      tags: [storage]
      summary: Disks and filesystems
      responses:
        "200": { $ref: "#/components/responses/Object" }
    post:
      x-ziro-role: admin
      tags: [storage]
      summary: Format and mount a data disk, {"device","mount"} (admin)
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/disks/expand:
    post:
      x-ziro-role: admin
      tags: [storage]
      summary: Grow the root filesystem to its disk (admin)
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/ssh/keys:
    get:
      x-ziro-role: admin
      tags: [security]
      summary: Authorized SSH keys
      responses:
        "200": { $ref: "#/components/responses/Object" }
    post:
      x-ziro-role: admin
      tags: [security]
      summary: Import keys, {"source":"gh:alice","sync":false} (admin)
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
    delete:
      x-ziro-role: admin
      tags: [security]
      summary: Remove keys imported from a source (admin)
      parameters:
        - name: source
          in: query
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/dns:
    get:
      x-ziro-role: viewer
      tags: [network]
      summary: Smart DNS configuration and statistics
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/dns/records:
    post:
      x-ziro-role: operator
      tags: [network]
      summary: Add a DNS record (operator)
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
    delete:
      x-ziro-role: operator
      tags: [network]
      summary: Remove a DNS record (operator)
      parameters:
        - { name: name, in: query, required: true, schema: { type: string } }
        - { name: type, in: query, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/dns/block:
    put:
      x-ziro-role: operator
      tags: [network]
      summary: Replace blocklists (operator)
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/dns/upstreams:
    put:
      x-ziro-role: admin
      tags: [network]
      summary: Replace upstream resolvers (admin)
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/dns/forwards:
    put:
      x-ziro-role: admin
      tags: [network]
      summary: Replace split-DNS forwards (admin)
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/modules:
    get:
      x-ziro-role: viewer
      tags: [modules]
      summary: Built-in and catalog modules (plugins) with their status
      responses:
        "200":
          description: Modules
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/ModuleInfo" } }
  /api/v1/modules/{name}/{action}:
    post:
      x-ziro-role: admin
      tags: [modules]
      summary: Enable, upgrade, disable or purge a module in the background (admin)
      parameters:
        - $ref: "#/components/parameters/Name"
        - name: action
          in: path
          required: true
          schema: { type: string, enum: [enable, upgrade, disable, purge] }
      responses:
        "202": { $ref: "#/components/responses/Message" }
        "404": { $ref: "#/components/responses/Message" }
  /api/v1/apps:
    get:
      x-ziro-role: viewer
      tags: [apps]
      summary: Deployed apps and how many replicas run
      responses:
        "200":
          description: Apps
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AppStatus" } }
  /api/v1/apps/deploy:
    post:
      x-ziro-role: admin
      tags: [apps]
      summary: Deploy (or update) an app from a catalog in the background (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppDeployRequest" }
      responses:
        "202": { $ref: "#/components/responses/Message" }
  /api/v1/apps/{name}:
    delete:
      x-ziro-role: admin
      tags: [apps]
      summary: Remove an app; purge=true also deletes its data and credentials (admin)
      parameters:
        - $ref: "#/components/parameters/Name"
        - { name: purge, in: query, schema: { type: boolean } }
      responses:
        "202": { $ref: "#/components/responses/Message" }
  /api/v1/apps/{name}/scale:
    post:
      x-ziro-role: operator
      tags: [apps]
      summary: 'Change the replicas of a deployed cluster app, {"replicas": n, "component": "web"}; only apps that replicate their data can grow, and replicas that list each other restart one at a time'
      parameters:
        - $ref: "#/components/parameters/Name"
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/pg:
    get:
      x-ziro-role: viewer
      tags: [pg]
      summary: Postgres clusters with their groups, members, roles and replication state
      responses:
        "200": { $ref: "#/components/responses/Object" }
    post:
      x-ziro-role: admin
      tags: [pg]
      summary: 'Create a Postgres cluster ({"name": "shop", "replicas": 2, "version": "17", "resources": {"memory": "4Gi"}, "shards": 0}); members are spread over nodes'
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/pg/{name}:
    get:
      x-ziro-role: viewer
      tags: [pg]
      summary: One Postgres cluster, with recent failover events
      parameters:
        - $ref: "#/components/parameters/Name"
      responses:
        "200": { $ref: "#/components/responses/Object" }
    delete:
      x-ziro-role: admin
      tags: [pg]
      summary: Remove a Postgres cluster; purge=true also deletes its data and credentials
      parameters:
        - $ref: "#/components/parameters/Name"
        - { name: purge, in: query, schema: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/pg/{name}/{action}:
    post:
      x-ziro-role: operator
      tags: [pg]
      summary: 'Change a cluster: scale ({"replicas": n}), add-replica, rm-replica ({"member": "m3"}), switchover ({"to": "m2"}), failover ({"to": "m2", "force": true}), reinit ({"member": "m3"}), add-shard, pause or resume. Credentials are never served over the API'
      parameters:
        - $ref: "#/components/parameters/Name"
        - { name: action, in: path, required: true, schema: { type: string, enum: [scale, add-replica, rm-replica, switchover, failover, reinit, add-shard, pause, resume] } }
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/docker-api:
    get:
      x-ziro-role: viewer
      tags: [host]
      summary: Whether the opt-in Docker Engine API socket is enabled and answering
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/docker-api/{action}:
    post:
      x-ziro-role: admin
      tags: [host]
      summary: Enable or disable the Docker Engine API socket. Anyone who can use the socket is root on the host
      parameters:
        - { name: action, in: path, required: true, schema: { type: string, enum: [enable, disable] } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/nfs:
    get:
      x-ziro-role: viewer
      tags: [storage]
      summary: NFS exports and mounts
      responses:
        "200":
          description: NFS configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/NFSConfig" }
  /api/v1/nfs/clients:
    get:
      x-ziro-role: viewer
      tags: [storage]
      summary: NFS clients connected to this server
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/NFSClient" } }
  /api/v1/gateway/routes:
    get:
      x-ziro-role: viewer
      tags: [gateway]
      summary: Routes with their resolved upstreams
      responses:
        "200":
          description: Routes
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/GatewayRouteState" } }
    post:
      x-ziro-role: admin
      tags: [gateway]
      summary: Create or replace a route (admin; live within a second)
      requestBody: { $ref: "#/components/requestBodies/GatewayRoute" }
      responses:
        "200": { description: The stored route, content: { application/json: { schema: { $ref: "#/components/schemas/GatewayRoute" } } } }
        "400": { $ref: "#/components/responses/Message" }
  /api/v1/gateway/routes/{name}:
    get:
      x-ziro-role: viewer
      tags: [gateway]
      summary: One route
      parameters: [{ $ref: "#/components/parameters/Name" }]
      responses:
        "200": { description: Route, content: { application/json: { schema: { $ref: "#/components/schemas/GatewayRouteState" } } } }
    put:
      x-ziro-role: admin
      tags: [gateway]
      summary: Create or replace this route (admin)
      parameters: [{ $ref: "#/components/parameters/Name" }]
      requestBody: { $ref: "#/components/requestBodies/GatewayRoute" }
      responses:
        "200": { description: The stored route, content: { application/json: { schema: { $ref: "#/components/schemas/GatewayRoute" } } } }
        "400": { $ref: "#/components/responses/Message" }
    delete:
      x-ziro-role: admin
      tags: [gateway]
      summary: Remove this route (admin)
      parameters: [{ $ref: "#/components/parameters/Name" }]
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/gateway/status:
    get:
      x-ziro-role: viewer
      tags: [gateway]
      summary: Upstream health, active connections and requests per route
      responses:
        "200": { description: Status, content: { application/json: { schema: { $ref: "#/components/schemas/GatewayStatus" } } } }
  /api/v1/gateway/settings:
    get:
      x-ziro-role: viewer
      tags: [gateway]
      summary: Gateway-wide settings, trusted proxies, PROXY protocol and drain time
      responses:
        "200": { $ref: "#/components/responses/Object" }
    put:
      x-ziro-role: admin
      tags: [gateway]
      summary: 'Replace the gateway-wide settings: trusted_proxies and proxy_protocol (only a trusted proxy may name the real client), drain_seconds, waf (the default firewall), waf_auto_update, deny_cidrs, bans and auto_ban ({"trusted_proxies": ["10.0.0.0/8"], "waf": {"mode": "detect"}, "auto_ban": {"strikes": 5}})'
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/gateway/waf/rules:
    get:
      x-ziro-role: viewer
      tags: [gateway]
      summary: The WAF rules in use, with their group, level, score and stage
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/gateway/waf/pack:
    get:
      x-ziro-role: viewer
      tags: [gateway]
      summary: The installed WAF rule pack, its signed index serial and expiry, staged rules and whether a rollback is possible
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/gateway/waf/update:
    post:
      x-ziro-role: admin
      tags: [gateway]
      summary: Fetch the newest signed WAF rule pack and install it; gateways switch within a second, and on a cluster master every node fetches it
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/gateway/waf/rollback:
    post:
      x-ziro-role: admin
      tags: [gateway]
      summary: Return to the WAF rule pack used before the last update
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/gateway/bans:
    get:
      x-ziro-role: viewer
      tags: [gateway]
      summary: Manual bans, and the automatic bans of the gateway running on this host
      responses:
        "200": { $ref: "#/components/responses/Object" }
    post:
      x-ziro-role: admin
      tags: [gateway]
      summary: 'Ban an address or network on every gateway node ({"addr": "203.0.113.0/24", "for": "24h", "reason": "scraper"}); without "for" until removed'
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/gateway/bans/{addr}:
    delete:
      x-ziro-role: admin
      tags: [gateway]
      summary: Lift a ban (an address, or a network written as in the ban; escape "/" as %2F)
      parameters:
        - name: addr
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/gateway/domain:
    get:
      x-ziro-role: viewer
      tags: [gateway]
      summary: The base domain of deployed apps, the gateway addresses and the DNS records to create
      responses:
        "200": { $ref: "#/components/responses/Object" }
    put:
      x-ziro-role: admin
      tags: [gateway]
      summary: 'Publish deployed apps at <app>.<domain> ({"name":"apps.example.com", "wildcard_cert": true}); adds a wildcard record to the built-in DNS; wildcard_cert serves the apps with one *.<domain> certificate issued through ACME DNS-01 (needs a DNS provider)'
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
    delete:
      x-ziro-role: admin
      tags: [gateway]
      summary: Stop publishing apps under a base domain (routes already created stay)
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/dns/cloud:
    get:
      x-ziro-role: viewer
      tags: [dns]
      summary: DNS providers (never their tokens), explicit records, published addresses and the last sync on this host
      responses:
