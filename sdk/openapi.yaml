      x-ziro-role: admin
      tags: [deploy]
      summary: Remove a deployment, its builds and its app (?purge=true also deletes the app's data and secrets)
      parameters:
        - $ref: "#/components/parameters/App"
        - { name: purge, in: query, schema: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/deployments/{app}/source:
    post:
      x-ziro-role: deployer
      tags: [deploy]
      summary: Deploy source a client uploads (multipart "spec" JSON with source_sha256, then "source" .tar.gz) and queue its build; an admin sets expose and publish
      parameters:
        - $ref: "#/components/parameters/App"
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { type: object }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/deployments/{app}/redeploy:
    post:
      x-ziro-role: deployer
      tags: [deploy]
      summary: Build the latest commit again ({"ref":"<branch>"} switches the branch) and release it
      parameters:
        - $ref: "#/components/parameters/App"
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/deployments/{app}/rollback:
    post:
      x-ziro-role: deployer
      tags: [deploy]
      summary: Release an earlier build's image again ({"build":"b3"}, default the previous one), without rebuilding
      parameters:
        - $ref: "#/components/parameters/App"
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /api/v1/hooks/deploy/{app}:
    post:
      x-ziro-role: public
      tags: [deploy]
      summary: Git push webhook (GitHub X-Hub-Signature-256 or GitLab X-Gitlab-Token, from ziroctl deploy hook); a push to the deployment's branch builds and releases it
      security: []
      parameters:
        - $ref: "#/components/parameters/App"
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "202": { $ref: "#/components/responses/Message" }
  /api/v1/deployments/{app}/builds/{id}/log:
    get:
      x-ziro-role: viewer
      tags: [deploy]
      summary: A build's log as text; ?follow=true streams it until the build finishes
      parameters:
        - $ref: "#/components/parameters/App"
        - { name: id, in: path, required: true, schema: { type: string, pattern: "^b[0-9]{1,9}$" } }
        - { name: follow, in: query, schema: { type: boolean } }
      responses:
        "200": { description: The log, content: { text/plain: { schema: { type: string } } } }
  /api/v1/sandboxes:
    get:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: The caller's sandboxes (operators and admins see all)
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [pending, running, paused, failed] } }
        - name: label
          in: query
          description: "metadata that must match: key=value, or key (set to anything); repeatable, all must match"
          schema: { type: array, items: { type: string } }
          style: form
          explode: true
      responses:
        "200":
          description: Sandboxes, oldest first
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Sandbox" } }
    post:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: Create a sandbox (gVisor, host limits, no network unless asked) and wait until it runs; the first use of an image pulls it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SandboxSpec" }
      responses:
        "200": { $ref: "#/components/responses/Sandbox" }
  /api/v1/sandboxes/mcp:
    post:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: Model Context Protocol (Streamable HTTP, JSON answers) serving the sandbox tools
      description: |
        One JSON-RPC 2.0 message per request (MCP 2025-06-18): initialize, ping, tools/list, tools/call.
        Each tool call goes through this API with the request's own token, so roles, scopes and the audit
        trail apply as for REST calls. Notifications are accepted with 202. There is no event stream (GET).
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [jsonrpc, method], properties: { jsonrpc: { type: string }, id: {}, method: { type: string }, params: { type: object } } }
      responses:
        "200":
          description: The JSON-RPC answer (a tool error is a result with isError, not a JSON-RPC error)
          content:
            application/json:
              schema: { type: object, properties: { jsonrpc: { type: string }, id: {}, result: { type: object }, error: { type: object } } }
        "202": { description: A notification, accepted }
        "400": { description: Not a JSON-RPC message }
  /api/v1/sandboxes/templates:
    get:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: The host's sandbox templates by name (create with "template")
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema: { type: object, additionalProperties: { $ref: "#/components/schemas/SandboxSpec" } }
  /api/v1/sandboxes/snapshots:
    get:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: The caller's snapshots (operators see all)
      responses:
        "200":
          description: Snapshots
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SandboxSnapshot" } }
    delete:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: Delete a snapshot (?image=ziro.local/sandbox/<owner>/<name>:<tag>)
      parameters:
        - { name: image, in: query, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/sandboxes/{id}/snapshot:
    post:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: 'Commit a sandbox''s filesystem to an image ({"name"}) that new sandboxes start from (use it as "image")'
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [name], additionalProperties: false, properties: { name: { type: string } } }
      responses:
        "200":
          description: The snapshot
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxSnapshot" }
  /api/v1/sandboxes/{id}:
    get:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: A sandbox (404 for another owner's, unless operator)
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      responses:
        "200": { $ref: "#/components/responses/Sandbox" }
    delete:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: Delete a sandbox and its workspace
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/sandboxes/{id}/stats:
    get:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: A running or paused sandbox's resource use, from its cgroup (CPU over a 0.5 s sample; byte counters since it started)
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      responses:
        "200":
          description: Resource use
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxStats" }
  /api/v1/sandboxes/{id}/logs:
    get:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: The end of the output (stdout and stderr) of the sandbox's main command; at most 4 MiB
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - { name: tail, in: query, schema: { type: integer, minimum: 1, maximum: 10000, default: 200 } }
      responses:
        "200":
          description: Output
          content:
            application/json:
              schema: { type: object, properties: { logs: { type: string } } }
  /api/v1/sandboxes/{id}/pause:
    post:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: Freeze a running sandbox's processes (memory is kept)
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      responses:
        "200": { $ref: "#/components/responses/Sandbox" }
  /api/v1/sandboxes/{id}/resume:
    post:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: Thaw a paused sandbox
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      responses:
        "200": { $ref: "#/components/responses/Sandbox" }
  /api/v1/sandboxes/{id}/renew:
    post:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: 'Move the expiry to now + timeout ({"timeout":"1h"}; default: the sandbox''s own), within the host maximum'
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      requestBody: { $ref: "#/components/requestBodies/Object" }
      responses:
        "200": { $ref: "#/components/responses/Sandbox" }
  /api/v1/sandboxes/{id}/metadata:
    put:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: Replace a sandbox's metadata (string map)
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Sandbox" }
  /api/v1/sandboxes/{id}/network:
    put:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: Replace a sandbox's egress policy and apply it now (a sandbox created without a network can't get one; allowing a private range needs operator)
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SandboxNetwork" }
      responses:
        "200": { $ref: "#/components/responses/Sandbox" }
  /api/v1/sandboxes/{id}/previews:
    post:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: Publish a port at https://<port>-<id>.<gateway domain> (needs a network and a gateway domain); a private preview's answer has a token, posting again mints another
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [port]
              additionalProperties: false
              properties:
                port: { type: integer, minimum: 1, maximum: 65535 }
                public: { type: boolean, description: no token needed }
                ttl: { type: string, description: "lifetime of the returned token (default and maximum: the sandbox's)" }
      responses:
        "200":
          description: The preview
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxPreview" }
  /api/v1/sandboxes/{id}/previews/{port}:
    delete:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: Remove a preview (its gateway route) and revoke its tokens
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - { name: port, in: path, required: true, schema: { type: integer } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/sandboxes/{id}/access:
    get:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: A sandbox's SSH session tokens (never the tokens themselves)
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/SandboxAccess" } }
    post:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: 'Issue an SSH session token for the gateway: the answer has the ssh command (ssh -p 22998 zsbx_...@host) and the host key, shown once'
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                ttl: { type: string, description: "default 1h, at most 24h, never past the sandbox" }
                public_key: { type: string, description: authorized_keys line the client must also prove }
                single_use: { type: boolean }
      responses:
        "200":
          description: The token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SandboxAccess" }
  /api/v1/sandboxes/{id}/access/{aid}:
    delete:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: Revoke an SSH session token
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - { name: aid, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{8}$" } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/sandboxes/{id}/files:
    get:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: A file's content (application/octet-stream), or a directory listing (JSON array of SandboxFile)
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/SandboxPath"
      responses:
        "200":
          description: Content or listing
          content:
            application/octet-stream: { schema: { type: string, format: binary } }
            application/json: { schema: { type: array, items: { $ref: "#/components/schemas/SandboxFile" } } }
    put:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: Write a file (raw body, up to 100 MiB; ?mode=0755), creating its directories
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/SandboxPath"
        - { name: mode, in: query, schema: { type: string, pattern: "^0?[0-7]{3}$" } }
      requestBody:
        required: true
        content:
          application/octet-stream: { schema: { type: string, format: binary } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
    delete:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: Remove a file, or a directory with ?recursive=true
      parameters:
        - $ref: "#/components/parameters/SandboxID"
        - $ref: "#/components/parameters/SandboxPath"
        - { name: recursive, in: query, schema: { type: boolean } }
      responses:
        "200": { $ref: "#/components/responses/Message" }
  /api/v1/sandboxes/{id}/exec:
    post:
      x-ziro-role: deployer
      tags: [sandboxes]
      summary: Run a command in a running sandbox and stream its output as NDJSON (SandboxExecEvent lines, the last one has exit_code or error)
      parameters:
        - $ref: "#/components/parameters/SandboxID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SandboxExecRequest" }
      responses:
        "200":
          description: Output events, then the exit code
          content:
            application/x-ndjson:
              schema: { $ref: "#/components/schemas/SandboxExecEvent" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
  parameters:
    App:
      name: app
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9_.-]{0,62}$" }
    Name:
      name: name
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9_.-]{0,62}$" }
    SandboxID:
      name: id
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z2-7]{12}$" }
    SandboxPath:
      name: path
      in: query
      required: true
      description: inside /workspace (absolute or relative to it)
      schema: { type: string }
  requestBodies:
    Stack:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Stack" }
    Object:
      content:
        application/json:
          schema: { type: object }
    GatewayRoute:
      required: true
      content:
        application/json:
          schema: { $ref: "#/components/schemas/GatewayRoute" }
  responses:
    Object:
      description: JSON object
      content:
        application/json:
          schema: { type: object }
    Message:
      description: Result
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Message" }
    Sandbox:
      description: The sandbox
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Sandbox" }
  schemas:
    Token:
      type: object
      properties:
        name: { type: string }
        role: { type: string, enum: [viewer, deployer, operator, admin] }
        id: { type: string }
        created: { type: string, format: date-time }
        expires: { type: string, format: date-time, description: "empty: never" }
        scopes: { type: array, items: { type: string }, description: "API areas the token is limited to (empty: all its role allows)" }
        token: { type: string, description: "the secret: only when it is created or rotated" }
    SandboxSpec:
      type: object
      additionalProperties: false
      properties:
        template: { type: string, description: "start from a host template; fields set here override it (image is then optional)" }
        image: { type: string, description: "registry/name[:tag][@sha256:...]; checked against the host's image policy" }
        runtime: { type: string, enum: [gvisor, gvisor-kvm, runc], description: "gvisor (default, or the host's default_runtime); gvisor-kvm needs /dev/kvm; runc needs operator and allow_runc on the host" }
        command: { type: array, items: { type: string }, description: "default: keep the sandbox up (sleep infinity)" }
        env: { type: object, additionalProperties: { type: string } }
        user: { type: string, pattern: "^[0-9]{1,10}(:[0-9]{1,10})?$" }
        workdir: { type: string, description: default /workspace }
        resources:
          type: object
          properties:
            memory: { type: string, example: 2Gi }
            cpus: { type: number }
            pids: { type: integer }
        timeout: { type: string, description: "lifetime, e.g. 30m (default 1h, host maximum 24h)" }
        idle_timeout: { type: string, description: delete after this long without an exec }
        metadata: { type: object, additionalProperties: { type: string } }
        network: { $ref: "#/components/schemas/SandboxNetwork" }
        secrets:
          type: array
          maxItems: 16
          description: "Credential injection: the variable holds a placeholder; the host's egress proxy swaps in the value only in HTTPS requests to its hosts. Values are write-only."
          items:
            type: object
            required: [name, hosts]
            additionalProperties: false
            properties:
              name: { type: string }
              value: { type: string, writeOnly: true }
              hosts: { type: array, items: { type: string }, description: "exact names or *.x" }
    SandboxNetwork:
      type: object
      additionalProperties: false
      description: "Egress policy. Never the host, other sandboxes, link-local/metadata or private ranges (unless an operator allows one)."
      properties:
        mode: { type: string, enum: [none, allowlist, open], description: "none (default): no interface; open: the public internet" }
        allow:
          type: array
          maxItems: 64
          items: { type: string }
          description: "allowlist: domains (subdomains included, *.x too), IPv4 addresses and CIDRs"
    Sandbox:
      type: object
      properties:
        id: { type: string }
        owner: { type: string, description: the token that created it (root from the host CLI) }
        state: { type: string, enum: [pending, running, paused, failed] }
        error: { type: string }
        ip: { type: string, description: address on the sandbox network }
        previews: { type: array, items: { $ref: "#/components/schemas/SandboxPreview" } }
        spec: { $ref: "#/components/schemas/SandboxSpec" }
        created: { type: string, format: date-time }
        expires: { type: string, format: date-time }
        last_active: { type: string, format: date-time }
    SandboxExecRequest:
      type: object
      required: [command]
      additionalProperties: false
      properties:
        command: { type: array, items: { type: string } }
        env: { type: object, additionalProperties: { type: string } }
        workdir: { type: string }
        user: { type: string }
        stdin: { type: string, description: at most 1 MiB }
        timeout: { type: string, description: "default 5m, at most 1h" }
    SandboxPreview:
      type: object
      properties:
        port: { type: integer }
        public: { type: boolean }
        url: { type: string }
        created: { type: string, format: date-time }
        token: { type: string, description: "private previews, only when created: send as X-Ziro-Preview-Token, or open token_url once (sets a cookie)" }
        token_url: { type: string }
    SandboxStats:
      type: object
      properties:
        state: { type: string }
        cpu_percent: { type: number, description: "of one CPU" }
        memory_bytes: { type: integer, format: int64 }
        memory_limit: { type: integer, format: int64 }
        pids: { type: integer }
        net_rx_bytes: { type: integer, format: int64 }
        net_tx_bytes: { type: integer, format: int64 }
        block_read_bytes: { type: integer, format: int64 }
        block_write_bytes: { type: integer, format: int64 }
    SandboxSnapshot:
      type: object
      properties:
        image: { type: string, description: "ziro.local/sandbox/<owner>/<name>:<unix time>" }
        sandbox: { type: string }
        size: { type: string, description: "the image's size" }
        created: { type: string, format: date-time }
        workspace_size: { type: integer, format: int64, description: "bytes of the /workspace archive kept with the image" }
        nodes: { type: integer, description: "on a cluster master: how many nodes hold a copy" }
    SandboxAccess:
      type: object
      properties:
        id: { type: string }
        created: { type: string, format: date-time }
        expires: { type: string, format: date-time }
        key_fingerprint: { type: string }
        single_use: { type: boolean }
        used: { type: boolean }
        username: { type: string, description: "the token (zsbx_...), only when created" }
        ssh: { type: string, description: ready-to-run ssh command, only when created }
        host_key: { type: string, description: "known_hosts line for the gateway, only when created" }
    SandboxFile:
      type: object
      properties:
        name: { type: string }
        size: { type: integer }
        mode: { type: string }
        dir: { type: boolean }
        modified: { type: string, format: date-time }
    SandboxExecEvent:
      type: object
      properties:
        stream: { type: string, enum: [stdout, stderr] }
        data: { type: string }
        exit_code: { type: integer }
        error: { type: string }
    DeployRequest:
      type: object
      required: [name, repo]
      additionalProperties: false
      properties:
        name: { type: string }
        repo: { type: string, description: https URL without credentials }
        ref: { type: string, description: branch or tag }
        path: { type: string, description: subdirectory to build }
        port: { type: integer }
        publish: { type: integer, description: host port on 127.0.0.1 }
        env: { type: object, additionalProperties: { type: string } }
        secrets: { type: array, items: { type: string }, description: names of input secrets the app receives }
        secret_values: { type: object, additionalProperties: { type: string }, description: values for those secrets (kept by the app) }
        git_token: { type: string, description: access token for a private repository (stored 0600) }
        expose: { type: string }
        expose_tls: { type: string }
        resources: { type: object }
    Stack:
      type: object
      required: [stack, version, apps]
      additionalProperties: false
      properties:
        stack: { type: string, description: the stack's name }
        version: { type: integer, enum: [1] }
        description: { type: string }
        apps:
          type: object
          additionalProperties:
            type: object
            required: [app]
            additionalProperties: false
            properties:
              app: { type: string, description: "catalog name[:version]" }
              set: { type: object, additionalProperties: { type: string } }
              replicas: { type: integer }
              publish: { type: integer }
              expose: { type: string }
              expose_tls: { type: string }
              resources: { type: object, properties: { memory: { type: string }, cpus: { type: number }, pids: { type: integer } } }
              depends_on: { type: array, items: { type: string } }
    Message:
      type: object
      properties:
        status: { type: string, enum: [ok, error, accepted] }
        code: { type: string, description: "errors: invalid, unauthorized, forbidden, not_found, method_not_allowed, conflict, too_large, rate_limited, internal" }
        message: { type: string }
    ModuleInfo:
      type: object
      properties:
        name: { type: string }
        version: { type: string }
        available: { type: string, description: newer version in a catalog }
        description: { type: string }
        source: { type: string, description: builtin, a catalog repo, or local }
        requires: { type: array, items: { type: string } }
        status: { type: string, enum: [available, installing, enabled, failed, disabling] }
        error: { type: string }
        auto: { type: boolean }
    AppStatus:
      type: object
      properties:
        name: { type: string }
        app: { type: string }
        version: { type: string }
        mode: { type: string, enum: [local, cluster] }
        publish: { type: string }
        components: { type: array, items: { type: string } }
        running: { type: string, examples: ["3/3"] }
    AppDeployRequest:
      type: object
      required: [app]
      properties:
        app: { type: string, examples: ["postgres:18"] }
        name: { type: string }
        set: { type: object, additionalProperties: { type: string } }
        replicas: { type: integer }
        publish: { type: integer }
        allow_from: { type: array, items: { type: string } }
        expose: { type: string, description: publish through the gateway on this hostname }
        expose_tls: { type: string, examples: [auto, internal, off, "cert:name"] }
        secrets: { type: object, additionalProperties: { type: string }, description: values for the app's input secrets (see apps info) }
    NFSExport:
      type: object
      properties:
        path: { type: string }
        clients: { type: array, items: { type: string } }
        read_only: { type: boolean }
        squash: { type: string, enum: [root, all, none] }
        owner: { type: string, examples: ["1000:1000"] }
    NFSConfig:
      type: object
      properties:
        exports: { type: array, items: { $ref: "#/components/schemas/NFSExport" } }
        mounts: { type: array, items: { type: object } }
    NFSClient:
      type: object
      properties:
        address: { type: string }
        name: { type: string }
        minor_version: { type: string }
        status: { type: string }
        open_files: { type: integer }
        exports: { type: array, items: { type: string } }
    GatewayUpstream:
      type: object
      properties:
        app: { type: string }
        address: { type: string, description: "IP:port" }
        weight: { type: integer, minimum: 1, maximum: 1000 }
    GatewayRoute:
      type: object
      description: A routing rule. Exactly one of to, redirect, respond.
      properties:
        name: { type: string }
        kind: { type: string, enum: [http, tcp, tls], default: http }
        hosts: { type: array, items: { type: string }, description: 'exact names or "*.domain" (one label)' }
        path_prefix: { type: string, default: / }
        path_exact: { type: boolean }
        methods: { type: array, items: { type: string } }
        headers: { type: object, additionalProperties: { type: string } }
        listen: { type: integer, description: port of a tcp route }
        to: { type: array, items: { $ref: "#/components/schemas/GatewayUpstream" } }
        lb: { type: string, enum: [round_robin, least_conn, p2c, ip_hash, hash, cookie] }
        health:
          type: object
          properties:
            path: { type: string }
            interval: { type: string, examples: [10s] }
            expect: { type: integer }
        redirect: { type: string, description: '"{uri}" is the request URI' }
        redirect_code: { type: integer, enum: [301, 302, 307, 308] }
        respond:
          type: object
          properties:
            status: { type: integer }
            body: { type: string }
        strip_prefix: { type: string }
        request_headers: { $ref: "#/components/schemas/HeaderRules" }
        response_headers: { $ref: "#/components/schemas/HeaderRules" }
        retries: { type: integer, minimum: 0, maximum: 5 }
        timeout: { type: string }
        compress: { type: boolean }
        tls: { type: string, examples: [auto, off, internal, "cert:name"] }
        allow_cidrs: { type: array, items: { type: string } }
        rate_rps: { type: integer }
        max_body_mb: { type: integer }
        basic_auth: { type: object, additionalProperties: { type: string }, description: user -> bcrypt hash }
        path_regex: { type: string, description: RE2 expression the path must also match }
        header_matchers: { type: array, items: { $ref: "#/components/schemas/GatewayMatcher" } }
        query_matchers: { type: array, items: { $ref: "#/components/schemas/GatewayMatcher" } }
        cookie_matchers: { type: array, items: { $ref: "#/components/schemas/GatewayMatcher" } }
        timeouts:
          type: object
          properties:
            connect: { type: string, examples: [5s] }
            response_header: { type: string, description: per attempt }
            request: { type: string, description: the whole exchange }
            idle: { type: string, description: longest silence from the upstream while streaming }
        retry_on: { type: array, items: { type: string, enum: [connect, 5xx, timeout, reset] } }
        retry_budget: { type: integer, minimum: 0, maximum: 100, description: retries as a percent of requests (default 20) }
        outlier:
          type: object
          description: Eject upstreams that keep failing
          properties:
            consecutive: { type: integer, description: failures in a row (default 5) }
            eject_for: { type: string, description: first ejection time, doubling per repeat (default 30s) }
            max_eject_percent: { type: integer, description: never eject more than this share (default 50) }
            slow_start: { type: string, description: ramp traffic back over this time }
        max_concurrent: { type: integer, description: requests in flight on the route; over it gets 503 }
        max_upstream_conns: { type: integer, description: requests in flight per upstream }
        hash_key: { type: string, description: 'with lb hash: ip, header:Name, cookie:Name or query:name' }
        rate_key: { type: string, description: 'what rate_rps counts per: ip (default), header:Name, cookie:Name, query:name' }
        rate_burst: { type: integer }
        mirror:
          type: object
          description: Copy a share of the traffic to another upstream and discard the answer
          properties:
            app: { type: string }
            address: { type: string, description: "IP:port" }
            percent: { type: integer, minimum: 1, maximum: 100 }
        rewrite:
          type: object
          properties:
            pattern: { type: string, description: RE2 expression over the path }
            replace: { type: string, description: replacement; $1 refers to a group }
        cors:
          type: object
          description: Answer CORS preflights and add the response headers
          properties:
            origins: { type: array, items: { type: string } }
            methods: { type: array, items: { type: string } }
            headers: { type: array, items: { type: string } }
            expose: { type: array, items: { type: string } }
            credentials: { type: boolean }
            max_age: { type: integer }
        security_headers: { type: boolean, description: add nosniff, frame and referrer headers the app does not set }
        upstream_proto: { type: string, enum: [http, https, h2c] }
        upstream_tls:
          type: object
          properties:
            server_name: { type: string }
            ca_pem: { type: string, description: trusted CA certificates (PEM); empty = system roots }
        waf: { $ref: "#/components/schemas/GatewayWAF" }
        deny_cidrs: { type: array, items: { type: string }, description: refused even when allow_cidrs would admit them }
    GatewayWAF:
      type: object
      description: Web application firewall; requests are scored and blocked at the threshold
      properties:
        mode: { type: string, enum: [off, detect, block], default: detect }
        level: { type: integer, minimum: 1, maximum: 3, default: 1 }
        threshold: { type: integer, minimum: 1, maximum: 100, default: 5 }
        exclude: { type: array, items: { type: string }, description: 'rule IDs (ZW-942100) or groups (sqli, xss, lfi, rce, java, xxe, ssrf, protocol, scanner)' }
        inspect_body_kb: { type: integer, minimum: 1, maximum: 256, default: 8 }
        skip_body: { type: boolean }
        rules:
          type: array
          description: Custom rules, evaluated before the built-in ones
          items:
            type: object
            properties:
              id: { type: string }
              target: { type: string, description: 'path, query, body, method, host, user_agent, ip, arg:NAME, header:Name, cookie:NAME' }
              op: { type: string, enum: [eq, contains, prefix, suffix, regex, cidr] }
              value: { type: string }
              not: { type: boolean }
              action: { type: string, enum: [allow, deny, log, score] }
              score: { type: integer, minimum: 1, maximum: 20 }
    GatewayMatcher:
      type: object
      properties:
        name: { type: string }
        op: { type: string, enum: [eq, present, prefix, regex], default: eq }
        value: { type: string }
    HeaderRules:
      type: object
      properties:
        set: { type: object, additionalProperties: { type: string } }
        remove: { type: array, items: { type: string } }
    GatewayRouteState:
      allOf:
        - $ref: "#/components/schemas/GatewayRoute"
        - type: object
          properties:
            upstreams: { type: array, items: { type: string } }
            targets:
              type: array
              items:
                type: object
                properties:
                  addr: { type: string }
                  weight: { type: integer }
            mirror_targets:
              type: array
              items:
                type: object
                properties:
                  addr: { type: string }
                  weight: { type: integer }
    GatewayStatus:
      type: object
      properties:
        routes:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              kind: { type: string }
              match: { type: string }
              tls: { type: string }
              upstreams:
                type: array
                items:
                  type: object
                  properties:
                    addr: { type: string }
                    share: { type: integer, description: percent of the route's traffic }
                    healthy: { type: boolean }
                    active: { type: integer }
              requests: { type: object, additionalProperties: { type: integer } }
        internal_ca: { type: string }
